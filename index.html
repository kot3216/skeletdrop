<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0719">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>SkeletDrop</title>
<style>
:root{
  --void:#0f0719;--deep:#170d29;--surface:#1e1236;--raise:#2a1a4a;--scrim:rgba(8,3,16,.86);
  --iris:#a855f7;--iris-d:#6d28d9;--azure:#2f8fff;--acid:#3ddc9a;--amber:#ffc94d;
  --ember:#ff8a3d;--crimson:#ff4f6b;--rose:#ff6fae;
  --ink:#f7f3ff;--dim:#a494c8;--warm:#f6e3c8;--cool:#93a8cf;
  --pane:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.025));
  --edge:rgba(168,85,247,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--void);color:var(--ink);overflow-x:hidden;font-family:'Segoe UI',system-ui,Arial,sans-serif;
  background-image:radial-gradient(760px 420px at 92% -8%,rgba(109,40,217,.42),transparent 70%),radial-gradient(620px 380px at -12% 34%,rgba(168,85,247,.22),transparent 70%),radial-gradient(520px 340px at 58% 96%,rgba(47,143,255,.16),transparent 70%)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--deep);border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--iris),var(--iris-d));border-radius:8px;border:1px solid var(--raise)}
*{scrollbar-width:thin;scrollbar-color:var(--iris-d) var(--deep)}
.motes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.motes i{position:absolute;bottom:-14px;border-radius:50%;animation:drift linear infinite}
@keyframes drift{to{transform:translateY(-120vh)}}
.pane{background:var(--pane);backdrop-filter:blur(15px) saturate(160%);-webkit-backdrop-filter:blur(15px) saturate(160%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 6px 22px rgba(0,0,0,.42);position:relative;overflow:hidden}
.pane::before{content:"";position:absolute;inset:0 0 64% 0;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent);pointer-events:none;border-radius:inherit}
header{position:sticky;top:0;z-index:40;padding:8px 11px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(15,7,25,.8);backdrop-filter:blur(20px) saturate(175%);border-bottom:1px solid var(--edge)}
.brand{font-size:20px;font-weight:900;letter-spacing:-.8px;cursor:pointer;white-space:nowrap}
.brand span{background:linear-gradient(92deg,var(--warm),#d9a8ff 48%,var(--iris));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand i{font-style:normal;margin-right:4px;filter:drop-shadow(0 0 7px rgba(168,85,247,.8))}
.hud{display:flex;align-items:center;gap:6px}
.purse{border-radius:20px;padding:7px 11px;font-weight:800;font-size:11.5px;white-space:nowrap;color:var(--warm);font-variant-numeric:tabular-nums;transition:box-shadow .3s}
.purse.bump{box-shadow:0 0 0 2px rgba(61,220,154,.5),0 0 18px rgba(61,220,154,.35)}
.topup{border:0;border-radius:19px;padding:8px 12px;font-size:11.5px;font-weight:800;color:#2b1400;cursor:pointer;white-space:nowrap;background:linear-gradient(108deg,var(--amber),var(--ember));box-shadow:0 3px 14px rgba(255,138,61,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:.18s}
.topup:active{transform:scale(.94)}
.round{width:32px;height:32px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--ink);font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0;flex-shrink:0;transition:.18s}
.round:active{transform:scale(.88)}
main{max-width:1060px;margin:auto;padding:10px 10px 88px;position:relative;z-index:1}
.rise{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.rise.in{opacity:1;transform:none}
.spot{display:grid;grid-template-columns:1.3fr .8fr;min-height:152px;border-radius:20px;overflow:hidden;margin:6px 0 11px;border:1px solid var(--edge);background:linear-gradient(118deg,#42188c,#1c1036 54%,#5b21b6);box-shadow:0 14px 38px rgba(6,2,14,.7),inset 0 1px 0 rgba(255,255,255,.14)}
.spotart{background-size:contain;background-position:center;background-repeat:no-repeat;min-height:152px;position:relative;background-color:#150c26}
.spotart::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 54%,transparent 30%,rgba(28,16,54,.88) 96%)}
.spottxt{padding:14px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(90deg,rgba(23,13,41,.82),rgba(59,29,120,.7))}
.pill{border-radius:16px;padding:5px 9px;width:max-content;font-weight:800;font-size:9.5px;margin-bottom:9px;letter-spacing:.4px}
.beacon{display:inline-block;width:7px;height:7px;background:var(--acid);border-radius:50%;box-shadow:0 0 8px var(--acid);margin-right:5px;animation:beat 1.6s infinite}
@keyframes beat{50%{opacity:.3}}
.spottxt h1{font-size:clamp(18px,4.4vw,29px);line-height:1.06;margin:0 0 6px;letter-spacing:-.6px}
.spottxt p{font-size:11.5px;font-weight:600;color:#ded1ff;margin:0 0 11px}
.spotbtn{width:max-content;padding:9px 16px;border-radius:17px;font-size:12px;font-weight:800;color:#fff;border:0;cursor:pointer;background:linear-gradient(100deg,var(--iris),var(--iris-d));box-shadow:0 5px 16px rgba(168,85,247,.4)}
.spotbtn:active{transform:scale(.96)}
.pips{display:flex;gap:6px;margin-top:11px}
.pips i{width:6px;height:6px;border-radius:6px;background:#7a68a6;transition:.4s}
.pips i.on{width:19px;background:linear-gradient(90deg,var(--warm),#d9a8ff)}
.clock{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:13px;padding:8px 11px;margin-bottom:12px;background:linear-gradient(104deg,rgba(61,220,154,.13),rgba(47,143,255,.09));border:1px solid rgba(61,220,154,.28)}
.clock b{font-size:10.5px;font-weight:800;color:var(--acid);letter-spacing:.3px}
.clock span{font-size:12.5px;font-weight:900;color:var(--warm);font-variant-numeric:tabular-nums}
.feed{display:flex;align-items:center;gap:8px;margin-bottom:15px}
.feedtag{writing-mode:vertical-rl;transform:rotate(180deg);border-radius:11px;padding:7px 4px;font-weight:900;font-size:9px;letter-spacing:2px;color:#d9a8ff;flex-shrink:0}
.feedrow{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 0}
.feedrow::-webkit-scrollbar{display:none}
.tick{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:2px 12px;animation:tickIn .45s cubic-bezier(.2,.8,.3,1.1)}
.tick+.tick{border-left:1px solid rgba(255,255,255,.08)}
.tick img{width:29px;height:29px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.tick small{display:block;color:var(--dim);font-size:9.5px;white-space:nowrap}
.tick b{display:block;font-size:12px;margin-top:1px;white-space:nowrap;color:var(--acid)}
.tick b.nft{color:var(--amber)}
@keyframes tickIn{from{transform:translateY(7px);opacity:0}to{transform:none;opacity:1}}
h2{font-size:19px;margin:19px 0 10px;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
h2 em{font-style:normal;font-size:9.5px;font-weight:800;padding:4px 8px;border-radius:13px;color:#e4d3ff}
.note{color:var(--dim);font-size:10.5px;line-height:1.45}
.t-common{--rc:#a494c8}.t-rare{--rc:#2f8fff}.t-epic{--rc:#a855f7}.t-legend{--rc:#ffc94d}
.grade{font-size:8.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 48%,transparent);padding:2px 6px;border-radius:11px;width:max-content;margin-top:3px;background:color-mix(in srgb,var(--rc) 12%,transparent)}
.starval{display:inline-block;font-size:9px;font-weight:900;color:#3a2500;background:linear-gradient(108deg,var(--amber),var(--ember));padding:2px 6px;border-radius:11px;margin-top:3px}
.vaults{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.vault{border-radius:16px;padding:7px;transition:transform .24s,border-color .24s,box-shadow .24s}
.vault:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--rc) 55%,transparent);box-shadow:0 12px 26px rgba(6,2,14,.7)}
.vaultart{width:100%;height:104px;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--rc) 25%,#221537),#150c26)}
.vaultart .halo{position:absolute;inset:-32%;opacity:.5;filter:blur(14px);animation:orbit 7s linear infinite;background:conic-gradient(from 0deg,transparent 0 68%,color-mix(in srgb,var(--rc) 78%,transparent) 86%,transparent 100%)}
@keyframes orbit{to{transform:rotate(360deg)}}
.vaultart img{width:76px;height:76px;object-fit:contain;position:relative;z-index:2;animation:hover 3.2s ease-in-out infinite;filter:drop-shadow(0 5px 13px color-mix(in srgb,var(--rc) 55%,transparent))}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cap{position:absolute;top:6px;right:6px;z-index:3;font-weight:900;font-size:8.5px;padding:4px 7px;border-radius:10px;color:#3a2500;background:linear-gradient(108deg,var(--amber),var(--ember));white-space:nowrap;box-shadow:0 0 10px rgba(255,201,77,.4)}
.vaultfoot{display:flex;align-items:flex-start;justify-content:space-between;gap:5px;padding:7px 2px 2px}
.vaultfoot h3{font-size:12.5px;margin:0 0 2px;line-height:1.15}
.tag{font-size:11px;font-weight:800;padding:5px 8px;border-radius:12px;white-space:nowrap;background:linear-gradient(108deg,var(--iris),var(--iris-d))}
.tag.gratis{background:linear-gradient(108deg,#25c98d,#0d8f63)}
.arena{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.arenacard{height:88px;border-radius:14px;position:relative;overflow:hidden;cursor:pointer;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15);box-shadow:0 5px 16px rgba(0,0,0,.4);transition:transform .2s,box-shadow .2s}
.arenacard::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 56%)}
.arenacard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.2) 48%,transparent 62%);transform:translateX(-120%)}
.arenacard:hover::after{transform:translateX(120%);transition:transform .75s ease}
.arenacard:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(6,2,14,.7)}
.arenacard:active{transform:scale(.97)}
.arenacard b{position:relative;font-size:16px;font-weight:900;letter-spacing:2.6px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.act{border:0;color:#fff;border-radius:11px;padding:9px 11px;font-weight:800;font-size:11.5px;cursor:pointer;background:linear-gradient(108deg,var(--iris),var(--iris-d));box-shadow:0 3px 11px rgba(168,85,247,.34),inset 0 1px 0 rgba(255,255,255,.34);transition:.16s;text-decoration:none;display:inline-block;text-align:center}
.act:hover{filter:brightness(1.1)}
.act:active{transform:scale(.96)}
.act.ghost{background:var(--raise);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.act.good{background:linear-gradient(108deg,#25c98d,#0d8f63)}
.act.sky{background:linear-gradient(108deg,#3aa0ee,#1d6fb8)}
.act.sun{background:linear-gradient(108deg,var(--amber),var(--ember));color:#3a2500}
.act:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:none}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.item{border-radius:14px;padding:7px;transition:transform .24s}
.item:hover{transform:translateY(-3px)}
.item img{width:100%;height:66px;object-fit:contain;border-radius:10px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 16%,#2a1a4a),#150c26)}
.item h3{font-size:11px;margin:6px 0 1px}
.itemacts{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.itemacts .act{padding:6px 5px;font-size:10px}
.empty{grid-column:1/-1;text-align:center;padding:22px;border-radius:15px;color:var(--dim);font-weight:600;font-size:12px}
.veil{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(8px);z-index:60;display:none;align-items:center;justify-content:center;padding:12px}
.veil.on{display:flex}
.sheet{width:min(470px,100%);border-radius:20px;padding:15px;max-height:91vh;overflow:auto;animation:sheetIn .34s cubic-bezier(.2,.9,.3,1.25)}
.sheet.jolt{animation:jolt .5s}
@keyframes jolt{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
.sheet h2{font-size:18px;margin:0 0 9px}
.shut{float:right;border:0;color:var(--ink);width:29px;height:29px;border-radius:50%;font-size:16px;cursor:pointer;background:rgba(255,255,255,.1)}
.meters{display:flex;gap:7px;margin:3px 0 6px}
.meters div{flex:1;text-align:center;padding:7px;border-radius:11px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.09)}
.meters b{display:block;font-size:14px;color:var(--amber);margin-top:1px;font-variant-numeric:tabular-nums}
.meters small{color:var(--dim);font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.block{display:flex;flex-direction:column;gap:9px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px;margin:9px 0}
.blockhead{display:flex;align-items:center;gap:10px}
.blockicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:linear-gradient(140deg,var(--raise),var(--deep));border:1px solid var(--edge)}
.blockhead b{font-size:13px;display:block;margin-bottom:2px}
.bundles{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.bundle{border:1px solid rgba(255,201,77,.32);border-radius:12px;padding:10px 4px;cursor:pointer;text-align:center;transition:.16s;background:linear-gradient(158deg,rgba(255,201,77,.12),rgba(168,85,247,.07))}
.bundle:hover{transform:translateY(-2px);background:linear-gradient(158deg,rgba(255,201,77,.2),rgba(168,85,247,.12))}
.bundle:active{transform:scale(.95)}
.bundle .s{font-size:15px;font-weight:900;color:var(--amber)}
.bundle .r{font-size:11px;font-weight:800;color:var(--acid);margin-top:2px}
.bundle .t{font-size:8px;font-weight:800;color:var(--dim);margin-top:2px;letter-spacing:.4px}
.strip{height:118px;overflow:hidden;border-radius:14px;background:var(--deep);position:relative;margin:10px 0;border:1px solid rgba(168,85,247,.4)}
.strip::before,.strip::after{content:"";position:absolute;top:0;bottom:0;width:46px;z-index:2;pointer-events:none}
.strip::before{left:0;background:linear-gradient(90deg,var(--deep),transparent)}
.strip::after{right:0;background:linear-gradient(-90deg,var(--deep),transparent)}
.needle{position:absolute;left:50%;top:0;bottom:0;width:2px;z-index:3;background:linear-gradient(var(--amber),transparent);box-shadow:0 0 8px var(--amber)}
.strip.live .needle{animation:needlePulse .45s infinite}
@keyframes needlePulse{50%{box-shadow:0 0 18px var(--amber);transform:scaleX(1.6)}}
.track{display:flex;align-items:center;gap:10px;height:100%;padding:8px;will-change:transform;transition:transform 3.4s cubic-bezier(.11,.74,.03,1)}
.track.blur{filter:blur(1.2px)}
.cell{flex:0 0 84px;height:96px;background:var(--raise);border:1px solid #6a48a0;border-radius:11px;display:grid;place-items:center;padding:5px}
.cell img{width:54px;height:54px;object-fit:contain}
.cell span{font-size:8.5px;color:var(--dim);text-align:center}
.cell.hit{border-color:var(--amber);box-shadow:0 0 15px rgba(255,201,77,.4);animation:cellPop .8s}
@keyframes cellPop{45%{transform:scale(1.2)}100%{transform:scale(1.08)}}
.verdict{display:none;text-align:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.05)}
.verdict.on{display:block;animation:sheetIn .45s}
.halo2{position:relative;width:118px;height:118px;margin:4px auto;display:grid;place-items:center}
.halo2 .beams{position:absolute;inset:-20px;border-radius:50%;animation:orbit 5s linear infinite;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(255,201,77,.26) 40deg 80deg,transparent 80deg 120deg,rgba(255,201,77,.26) 120deg 160deg,transparent 160deg 200deg,rgba(255,201,77,.26) 200deg 240deg,transparent 240deg 280deg,rgba(255,201,77,.26) 280deg 320deg,transparent 320deg 360deg)}
.halo2 img{position:relative;width:94px;height:94px;object-fit:contain;animation:pop .55s}
@keyframes pop{from{transform:scale(0) rotate(-22deg)}to{transform:none}}
.badge2{display:inline-block;font-weight:900;font-size:12.5px;padding:5px 11px;border-radius:13px;margin:6px 0 3px;background:linear-gradient(108deg,var(--amber),var(--ember));color:#3a2500}
.badge2.big{background:linear-gradient(108deg,var(--crimson),var(--amber));color:#360007;font-size:14px;animation:bigPulse 1s infinite}
@keyframes bigPulse{50%{box-shadow:0 0 26px var(--amber);transform:scale(1.05)}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.burst i{position:absolute;width:8px;height:11px;border-radius:2px;animation:fall 1.7s cubic-bezier(.15,.6,.4,1) forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rz));opacity:0}}
.field{width:100%;padding:10px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);color:var(--ink);font-size:14px;font-weight:700;outline:none;margin:5px 0;font-family:inherit}
.field:focus{border-color:var(--iris);box-shadow:0 0 0 3px rgba(168,85,247,.16)}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .act{flex:1;min-width:100px}
.tabs{display:flex;gap:7px;margin:7px 0}
.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.13);background:rgba(0,0,0,.26);color:#c1b0e4;font-weight:800;font-size:11px;cursor:pointer;transition:.16s}
.tabs button.on{background:linear-gradient(108deg,var(--iris),var(--iris-d));color:#fff;border-color:var(--iris)}
.card2{text-align:center;padding:16px 12px;border-radius:15px;margin:9px 0;background:linear-gradient(140deg,#2a1650,#150c26);border:1px solid rgba(168,85,247,.28)}
.card2 .ic{font-size:38px;display:inline-block;animation:hover 2.6s infinite}
.card2 h3{font-size:14px;margin:7px 0 5px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.tile{aspect-ratio:1;border-radius:10px;border:1px solid rgba(168,85,247,.28);background:linear-gradient(145deg,var(--raise),#150c26);display:grid;place-items:center;font-size:20px;cursor:pointer;transition:.14s;padding:0}
.tile:not(:disabled):hover{transform:translateY(-2px);border-color:var(--iris)}
.tile.safe{background:radial-gradient(circle,#0d8f63,#053f2c);border-color:var(--acid);animation:pop .3s}
.tile.bomb{background:radial-gradient(circle,#b3182f,#440812);border-color:var(--crimson);animation:jolt .4s}
.tile.fade{opacity:.38}
.cosmos{position:relative;height:206px;border-radius:15px;overflow:hidden;margin:10px 0;border:1px solid rgba(168,85,247,.4);background:radial-gradient(120% 92% at 78% 8%,#3a2a6e 0%,#1a1030 46%,#080513 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.7)}
.neb{position:absolute;inset:-20%;pointer-events:none;filter:blur(7px);animation:nebDrift 15s ease-in-out infinite alternate;background:radial-gradient(40% 40% at 72% 22%,rgba(168,85,247,.34),transparent 70%),radial-gradient(35% 35% at 22% 74%,rgba(47,143,255,.26),transparent 70%)}
@keyframes nebDrift{to{transform:translate3d(-9px,7px,0) scale(1.08)}}
.starfield{position:absolute;inset:0;pointer-events:none}
.starfield i{position:absolute;border-radius:50%;background:#fff;display:block}
.cosmos.fly .starfield i{animation:starRun linear infinite}
@keyframes starRun{from{transform:translate3d(0,0,0)}to{transform:translate3d(-130px,56px,0)}}
.orb{position:absolute;border-radius:50%;pointer-events:none;opacity:.85}
.orb.a{width:52px;height:52px;right:-13px;top:16px;box-shadow:0 0 22px rgba(59,130,246,.4),inset -6px -6px 12px rgba(0,0,0,.45);background:radial-gradient(circle at 34% 30%,#9ec5fd,#3b82f6 58%,#1c3a8a)}
.orb.b{width:25px;height:25px;left:14px;bottom:18px;box-shadow:0 0 16px rgba(219,39,119,.4);background:radial-gradient(circle at 36% 32%,#f9a8d4,#db2777 60%,#6d1a3a)}
.cosmos.fly .orb.a{animation:orbA 9s linear infinite}

const SFX={tap:()=>beep(520,.06,"triangle",.06),pin:()=>beep(880+Math.random()*320,.04,"sine",.045),gem:()=>{beep(740,.09,"sine",.1);setTimeout(()=>beep(990,.12,"sine",.1),60);},coin:()=>{beep(1180,.07,"square",.05);setTimeout(()=>beep(1580,.09,"square",.05),70);},win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15,"triangle",.12),i*85)),fail:()=>beep(190,.36,"sawtooth",.1,62),blast:()=>beep(92,.5,"sawtooth",.16,40),lift:()=>beep(170,.55,"sawtooth",.06,540),whirr:()=>beep(300,.9,"triangle",.05,900)};

function toast(msg){const old=document.querySelector(".sd-toast");if(old)old.remove();const el=document.createElement("div");el.className="sd-toast";el.textContent=msg;el.style.cssText="position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:rgba(30,18,54,.96);backdrop-filter:blur(14px);color:#fff;padding:11px 17px;border-radius:13px;z-index:200;font-weight:800;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.6);border:1px solid rgba(168,85,247,.35);text-align:center;max-width:90%;animation:sheetIn .3s";document.body.appendChild(el);setTimeout(()=>{el.style.transition="opacity .35s";el.style.opacity="0";setTimeout(()=>el.remove(),350);},2400);}
function burst(n){const cols=["#ffc94d","#a855f7","#3ddc9a","#2f8fff","#ff6fae","#ff8a3d","#fff"];const box=document.createElement("div");box.className="burst";for(let i=0;i<n;i++){const p=document.createElement("i");p.style.background=cols[i%cols.length];p.style.left=(30+Math.random()*40)+"%";p.style.top=(24+Math.random()*22)+"%";p.style.setProperty("--dx",(Math.random()*380-190)+"px");p.style.setProperty("--dy",(130+Math.random()*300)+"px");p.style.setProperty("--rz",(Math.random()*860-430)+"deg");p.style.animationDelay=(Math.random()*.25)+"s";box.appendChild(p);}document.body.appendChild(box);setTimeout(()=>box.remove(),2300);}
function pick(table){const total=table.reduce((a,x)=>a+x[0],0);let r=Math.random()*total;for(const [w,v] of table){r-=w;if(r<=0)return v;}return table[table.length-1][1];}

function rollVault(v){const win=pick(v.loot),t=tile(win);const isN=!!win.n,isC=!!win.cash;const value=isN?GIFT(win.n).price:(isC?win.cash:win.s*RATE);const big=isN||isC||win.s>=500;const cells=[];for(let i=0;i<22;i++){const x=tile(pick(v.loot));cells.push('<div class="cell"><img src="'+x.img+'" '+x.fb+'><span>'+x.txt+'</span></div>');}cells.push('<div class="cell" id="hitCell"><img src="'+t.img+'" '+t.fb+'><span>'+t.txt+'</span></div>');for(let i=0;i<7;i++){const x=tile(pick(v.loot));cells.push('<div class="cell"><img src="'+x.img+'" '+x.fb+'><span>'+x.txt+'</span></div>');}let body;if(isN){const g=GIFT(win.n);body='<div class="halo2"><div class="beams"></div><img src="'+g.img+'" '+guard(g.id)+'></div><h2 style="margin:6px 0 3px">'+g.name+'</h2><div class="badge2 big">🔥 ДЖЕКПОТ КЕЙСА!</div><div class="grade" style="margin:0 auto 6px">'+g.grade+' · ⭐ '+g.stars+'</div><p class="note">Подарок в коллекции! 🎉</p>';}else if(isC){body='<div class="halo2"><div class="beams"></div><img src="'+CASH_TILE+'"></div><h2 style="margin:6px 0 3px">ДЖЕКПОТ</h2><div class="badge2 big">💰 +'+rub(win.cash)+'</div><p class="note">Максимальный приз на балансе!</p>';}else{body='<div class="halo2"><div class="beams"></div><img src="'+starTile(win.s)+'"></div><h2 style="margin:6px 0 3px">+'+win.s+' ⭐</h2><div class="badge2'+(big?" big":"")+'">'+(big?"🔥 МЕГА-УЛОВ!":"Звёзды твои!")+'</div><p class="note">+'+rub(value)+' на баланс</p>';}openSheet('<h2>'+v.name+'</h2><div class="meters"><div><small>Цена</small><b>'+(v.free?"FREE":rub(v.price))+'</b></div><div><small>Макс. приз</small><b>'+rub(vaultCap(v))+'</b></div></div><div class="strip live" id="stripBox"><div class="needle"></div><div class="track blur" id="stripTrack">'+cells.join("")+'</div></div><div class="verdict" id="verdict">'+body+'<button class="act" style="width:100%" onclick="closeSheet()">Забрать</button></div>');if(v.free)S.freeAt=Date.now();if(isN)S.bag.push(win.n);else S.balance=(Math.round(Number(S.balance))||0)+Math.round(value);save();timers.push(setTimeout(()=>{const tr=document.getElementById("stripTrack");if(!tr)return;const w=tr.parentElement.clientWidth;tr.style.transform="translateX(-"+(8+22*94+42-w/2+(Math.random()*34-17))+"px)";},110));timers.push(setTimeout(()=>{const tr=document.getElementById("stripTrack");if(tr)tr.classList.remove("blur");const sb=document.getElementById("stripBox");if(sb)sb.classList.remove("live");const hc=document.getElementById("hitCell");if(hc)hc.classList.add("hit");if(big){burst(isC?92:56);SFX.win();const sh=document.querySelector(".sheet");if(sh){sh.classList.add("jolt");setTimeout(()=>sh.classList.remove("jolt"),600);}}else{burst(24);SFX.coin();}},3560));timers.push(setTimeout(()=>{const vd=document.getElementById("verdict");if(vd)vd.classList.add("on");},3880));}

function playPlinko(){PK=null;let pins="";for(let r=0;r<10;r++)for(let i=0;i<=r;i++)pins+='<span class="pin" id="pin-'+r+'-'+i+'" style="left:'+(50+(i-r/2)*(100/12))+'%;top:'+(16+r*19)+'px"></span>';let bins="";for(let k=0;k<11;k++)bins+='<span class="bin'+(PK_M[k]<1?" low":"")+'" id="bin-'+k+'" style="left:calc('+(50+(k-5)*(100/12))+'% - 4%);width:8%">'+PK_M[k]+'x</span>';openSheet('<h2>PLINKO</h2><p class="note">Шарик падает сквозь колышки. Куда упадёт — такой множитель.</p><input class="field" id="pkBet" type="number" min="5" value="15"><div class="board" id="pkBoard">'+pins+bins+'<span class="marble" id="pkBall" style="left:50%;top:6px"></span></div><div class="log" id="pkLog"></div><div class="note" id="pkMsg" style="text-align:center;margin:6px 0">Ставка и «Бросить»</div><button class="act" style="width:100%" id="pkGo" onclick="pkDrop()">Бросить шарик</button>');pkPaintLog();}

function pkDrop(){if(PK)return;const bet=stake("pkBet");if(!bet)return;document.getElementById("pkGo").disabled=true;SFX.tap();let right=0;const pts=[{x:50,y:6}],hits=[];for(let r=0;r<10;r++){hits.push([r,right]);const mid=r/2;let p=.5;if(right<mid)p=.85;else if(right>mid)p=.15;if(Math.random()<p)right++;pts.push({x:50+(right-(r+1)/2)*(100/12),y:16+(r+1)*19});}pts.push({x:50+(right-5)*(100/12),y:224});PK={bet,slot:right,pts,hits,t0:performance.now(),dur:1400};rafs.pk=requestAnimationFrame(pkFrame);}
function pkFrame(){const s=PK;if(!s)return;const t=Math.min(1,(performance.now()-s.t0)/s.dur);const seg=t*(s.pts.length-1),i=Math.min(s.pts.length-2,Math.floor(seg)),f=seg-i;const a=s.pts[i],b=s.pts[i+1],e=f*f*(3-2*f);const ball=document.getElementById("pkBall");if(ball){ball.style.left=(a.x+(b.x-a.x)*e)+"%";ball.style.top=(a.y+(b.y-a.y)*e)+"px";}const hi=Math.floor(seg);if(hi<s.hits.length){const [r,ri]=s.hits[hi],pin=document.getElementById("pin-"+r+"-"+ri);if(pin&&!pin.classList.contains("lit")){pin.classList.add("lit");SFX.pin();setTimeout(()=>pin.classList.remove("lit"),200);}}if(t>=1){pkDone();return;}rafs.pk=requestAnimationFrame(pkFrame);}
function pkDone(){const s=PK;if(!s)return;const m=PK_M[s.slot],win=Math.floor(s.bet*m);pkLog.unshift(m);pkLog=pkLog.slice(0,8);pkPaintLog();const bin=document.getElementById("bin-"+s.slot);if(bin){bin.classList.add("lit");setTimeout(()=>bin.classList.remove("lit"),900);}const msg=document.getElementById("pkMsg");if(m>=1){credit(win);if(m>=2){burst(40);SFX.win();}else SFX.coin();msg.innerHTML='<b style="color:var(--acid)">×'+m+' → +'+rub(win)+' 🎉</b>';}else{SFX.fail();msg.innerHTML='<b style="color:var(--crimson)">×'+m+' — мимо</b>';}document.getElementById("pkGo").disabled=false;PK=null;}

function playSlots(){openSheet('<h2>SLOTS</h2><p class="note">Три одинаковых символа — выигрыш. Остальное — мимо.</p><input class="field" id="slBet" type="number" min="5" value="15"><div class="reels"><div class="reel" id="sl0">🍒</div><div class="reel" id="sl1">💎</div><div class="reel" id="sl2">⭐</div><div class="payline"></div></div><div class="note" id="slMsg" style="text-align:center;margin:6px 0">Ставка и «Крутить»</div><button class="act sun" style="width:100%" id="slGo" onclick="slotSpin()">Крутить</button>');}
function slotSpin(){const bet=stake("slBet");if(!bet)return;document.getElementById("slGo").disabled=true;SFX.tap();const final=[pickSym(),pickSym(),pickSym()];const reels=[0,1,2].map(i=>document.getElementById("sl"+i));reels.forEach(r=>{r.classList.add("spin");r.classList.remove("stop");delete r.dataset.done;});const iv=setInterval(()=>{reels.forEach(r=>{if(!r.dataset.done)r.textContent=SYM[Math.floor(Math.random()*SYM.length)].s;});},70);timers.push(iv);reels.forEach((r,i)=>later(()=>{r.dataset.done="1";r.textContent=final[i].s;r.classList.remove("spin");r.classList.add("stop");SFX.pin();if(i===2){clearInterval(iv);slotDone(bet,final);}},700+i*450));}

let CR=null,crLog=[];

function crFrame(){const s=CR;if(!s||!s.live)return;const t=(performance.now()-s.t0)/1000,m=Math.pow(1.075,t);if(m>=s.cap){crashEnd(false);return;}s.m=m;const W=s.space.clientWidth,H=s.space.clientHeight;const prog=Math.min(1,Math.log(m)/Math.log(14));const x=12+prog*70,y=12+Math.pow(prog,.82)*66;const wob=Math.sin(t*5.5)*1.5,ang=-42+Math.sin(t*3.2)*5+prog*10;s.ship.style.left=x+"%";s.ship.style.bottom=(y+wob*.3)+"%";s.ship.style.transform="translate(-50%,50%) rotate("+ang+"deg)";const fs=1+Math.min(1.5,(m-1)*.28)+Math.sin(t*26)*.14;s.thrust.style.transform="translateX(-50%) scaleY("+fs+") scaleX("+(.9+Math.sin(t*31)*.12)+")";let d="M "+(12*W/100).toFixed(1)+" "+(H-12*H/100).toFixed(1);for(let i=1;i<=22;i++){const p=prog*i/22,xx=12+p*70,yy=12+Math.pow(p,.82)*66;d+=" L "+(xx*W/100).toFixed(1)+" "+(H-yy*H/100).toFixed(1);}s.path.setAttribute("d",d);s.mult.textContent="×"+m.toFixed(2);s.mult.style.color=m<2?"#c9b6ff":m<5?"#3ddc9a":m<10?"#ffc94d":"#ff8a3d";s.mult.style.transform="scale("+(1+Math.min(.22,(m-1)*.03))+")";s.drift-=Math.min(260,(m-1)*46)*.016;s.mesh.style.backgroundPosition=s.drift+"px "+(s.drift*.4)+"px";s.warp.style.opacity=Math.min(.85,(m-1)*.16);if(m>2&&Math.random()<.3)crSpark();rafs.cr=requestAnimationFrame(crFrame);}
function crSpark(){const s=CR;if(!s)return;const p=document.createElement("span");p.className="spark";p.style.left=s.ship.style.left;p.style.bottom=s.ship.style.bottom;p.style.setProperty("--sx",(-30-Math.random()*60)+"px");p.style.setProperty("--sy",(-10-Math.random()*40)+"px");s.space.appendChild(p);setTimeout(()=>p.remove(),620);}
function crashCash(){const s=CR;if(!s||!s.live)return;const win=Math.floor(s.bet*s.m);credit(win);burst(44);SFX.win();document.getElementById("crMsg").innerHTML='<b style="color:var(--acid)">Забрал ×'+s.m.toFixed(2)+' = '+rub(win)+' 🚀</b>';s.stat.textContent="ПРИЗ ЗАБРАН";s.stat.style.color="#3ddc9a";crashEnd(true);}

const UP={mode:"stars",bet:60,idx:-1,target:{t:"mult",m:2},busy:false,angle:0};

function upSource(){if(UP.mode==="gift"){const id=S.bag[UP.idx];if(!id)return null;const g=GIFT(id);return{kind:"gift",id,idx:UP.idx,value:g.price,name:g.name,img:g.img};}const v=Math.round(Number(UP.bet))||0;return{kind:"stars",value:v,name:v+" ₽ в звёздах",img:STAR_MINI};}

function playUpgrader(){UP.busy=false;UP.angle=0;if(UP.mode==="gift"&&(UP.idx<0||UP.idx>=S.bag.length))UP.idx=S.bag.length?0:-1;openSheet('<h2>UPGRADER</h2><p class="note">Поставь звёзды или подарок, выбери приз — и крути колесо. Чем жирнее приз, тем меньше шанс.</p><div class="tabs" id="upTabs"><button class="'+(UP.mode==="stars"?"on":"")+'" onclick="upMode(\'stars\')">⭐ Звёзды</button><button class="'+(UP.mode==="gift"?"on":"")+'" onclick="upMode(\'gift\')">🎁 Подарок</button></div><div id="upInput"></div><div class="upwrap"><div class="upcols"><div class="upslot src" id="upSrc"></div><div class="upslot dst" id="upDst"></div></div><div class="updial" id="upDial"><svg viewBox="0 0 200 200"><defs><filter id="upg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="upwin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddc9a"/><stop offset="1" stop-color="#2f8fff"/></linearGradient></defs><circle cx="100" cy="100" r="86" fill="none" stroke="#2a1a4a" stroke-width="17"/><circle cx="100" cy="100" r="86" fill="none" stroke="#43203a" stroke-width="17" stroke-dasharray="540.35 0" transform="rotate(-90 100 100)"/><circle id="upArc" cx="100" cy="100" r="86" fill="none" stroke="url(#upwin)" stroke-width="17" stroke-linecap="round" stroke-dasharray="0 540.35" transform="rotate(-90 100 100)" filter="url(#upg)"/><circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/><g id="upArrow"><path d="M100 6 L108 26 L92 26 Z" fill="#ffc94d" filter="url(#upg)"/><rect x="98.6" y="24" width="2.8" height="52" rx="1.4" fill="#ffc94d" opacity=".55"/><circle cx="100" cy="100" r="7" fill="#ffc94d" filter="url(#upg)"/><circle cx="100" cy="100" r="3" fill="#2a1a4a"/></g></svg><div class="upcenter"><div><div class="pct" id="upPct">0%</div><div class="cap2">ШАНС</div><div class="mx" id="upMx">×0.00</div></div></div></div><div class="note" style="text-align:center;margin-top:-2px">Цель</div><div class="chips" id="upChips"></div><div class="upres" id="upRes"></div><button class="act sun" style="width:100%" id="upGo" onclick="upSpin()">⚡ АПГРЕЙД</button><div class="log" id="upLog"></div></div>');upRenderInput();upRenderChips();upPaint();upPaintLog();}

function upSpin(){if(UP.busy)return;const s=upSource(),t=upTarget(),ch=upChance();if(!s||s.value<5)return toast("Поставь минимум 5 ₽");if(ch<=0)return toast("Приз должен быть дороже ставки");if(s.kind==="stars"){if(!debit(s.value))return;}else{if(!S.bag[s.idx])return toast("Подарок недоступен");S.bag.splice(s.idx,1);save();UP.idx=S.bag.length?Math.min(UP.idx,S.bag.length-1):-1;if(!S.bag.length)UP.mode="stars";}UP.busy=true;const go=document.getElementById("upGo");if(go)go.disabled=true;const dial=document.getElementById("upDial");if(dial)dial.classList.remove("win","lose");const res=document.getElementById("upRes");if(res)res.innerHTML='<span style="color:var(--amber)">Колесо крутится…</span>';const won=Math.random()<ch;const zone=ch*360;const land=won?Math.random()*zone*.94+zone*.03:zone+8+Math.random()*(360-zone-16);const start=UP.angle%360;const total=360*5+((land-start)%360+360)%360;const t0=performance.now(),dur=3200;SFX.whirr();let lastTick=0;function frame(){const p=Math.min(1,(performance.now()-t0)/dur);const e=1-Math.pow(1-p,4);const ang=start+total*e;UP.angle=ang;upArrow(ang);const step=Math.floor(ang/18);if(step!==lastTick){lastTick=step;if(p<.97)SFX.pin();}if(p<1){rafs.up=requestAnimationFrame(frame);return;}UP.angle=land;upArrow(land);upFinish(won,t,ch,dial,res);}rafs.up=requestAnimationFrame(frame);}

const NAMES=["neo_fox","dweee","Mira","tony","pixel_77","Luna","Max","Alex","kiryaa","Zoya","sk1e","dropp3r"];
const FEED_STARS=[1,5,10,15,25,50,100,250,500];
function feedTick(){const n=NAMES[Math.floor(Math.random()*NAMES.length)];if(Math.random()<.5){const g=GIFTS[Math.floor(Math.random()*GIFTS.length)];return '<div class="tick"><img src="'+g.img+'" '+guard(g.id)+'><div><small>'+n+' · '+g.name+'</small><b class="nft">'+rub(g.price)+'</b></div></div>';}const s=FEED_STARS[Math.floor(Math.random()*FEED_STARS.length)];return '<div class="tick"><img src="'+STAR_MINI+'"><div><small>'+n+' · +'+s+' ⭐</small><b>'+rub(s*RATE)+'</b></div></div>';}
function pushFeed(){const row=document.getElementById("feedRow");row.insertAdjacentHTML("afterbegin",feedTick());while(row.children.length>10)row.lastElementChild.remove();}
const SLIDES=[{t:"Кейсы с подарками",s:"NFT-подарки Telegram и звёзды внутри",i:4},{t:"Апгрейдни подарок",s:"Новый UPGRADER: колесо, стрелка и твой шанс ⚡",i:3},{t:"Джекпот до 99 999 ₽",s:"Максимальный приз — в кейсе «Кольцо» 💰",i:4}];
let slide=0;
function nextSlide(){slide=(slide+1)%SLIDES.length;const d=SLIDES[slide],t=document.getElementById("spotTitle"),p=document.getElementById("spotSub"),a=document.getElementById("spotArt");t.style.cssText=p.style.cssText=a.style.cssText="opacity:0;transform:translateY(8px);transition:.28s";setTimeout(()=>{t.textContent=d.t;p.textContent=d.s;a.style.backgroundImage='url("'+GIFTS[d.i].img+'")';t.style.cssText=p.style.cssText=a.style.cssText="opacity:1;transform:none;transition:.45s ease";},300);document.querySelectorAll("#spotPips i").forEach((x,i)=>x.classList.toggle("on",i===slide));}
function jump(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth"});}
document.querySelectorAll("#dock button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#dock button").forEach(x=>x.classList.remove("on"));b.classList.add("on");b.dataset.go==="top"?window.scrollTo({top:0,behavior:"smooth"}):jump(b.dataset.go);}));
window.addEventListener("scroll",()=>{const y=window.scrollY+window.innerHeight*.4;let a="top";["vaultsHead","arenaHead","shelfHead"].forEach(id=>{const el=document.getElementById(id);if(el&&el.offsetTop<=y)a=id;});document.querySelectorAll("#dock button").forEach(b=>b.classList.toggle("on",b.dataset.go===a));},{passive:true});
(function(){const box=document.getElementById("motes"),cols=["#a855f7","#2f8fff","#ff6fae","#ffc94d"];for(let i=0;i<14;i++){const d=document.createElement("i"),s=2+Math.random()*5;d.style.width=d.style.height=s+"px";d.style.left=Math.random()*100+"%";d.style.background=cols[i%cols.length];d.style.animationDuration=(10+Math.random()*14)+"s";d.style.animationDelay=(-Math.random()*20)+"s";d.style.opacity=(.08+Math.random()*.22);box.appendChild(d);}})();

document.getElementById("spotArt").style.backgroundImage='url("'+GIFTS[4].img+'")';
paint();writeDisk();
for(let i=0;i<6;i++)pushFeed();
setInterval(pushFeed,3600);
setInterval(nextSlide,5200);
setInterval(tickClock,1000);
watchRise();
if(TGI)pullCloud();
</script>
