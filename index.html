<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12081f">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>SkeletDrop — Gifts & Cases</title>
<style>
:root{--bg:#12081f;--acc:#a855f7;--acc2:#6d28d9;--mint:#39dca0;--gold:#ffd45d;--muted:#b3a5d6;--txt:#f6f2ff;--glass:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(1200px 600px at 85% -10%,#6d28d955,transparent),radial-gradient(900px 500px at -10% 35%,#a855f733,transparent),radial-gradient(700px 500px at 60% 90%,#4c1d9533,transparent),var(--bg);overflow-x:hidden}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#5b21b6;border-radius:10px}

/* фоновые частицы */
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgfx i{position:absolute;bottom:-10px;border-radius:50%;background:var(--acc);opacity:.22;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}

.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 30px #00000045;position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0 0 60% 0;background:linear-gradient(180deg,rgba(255,255,255,.13),transparent);pointer-events:none;border-radius:inherit}
header{padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:40;background:rgba(18,8,31,.62);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid rgba(168,85,247,.18)}
.logo{font-size:30px;font-weight:900;letter-spacing:-1.5px;cursor:pointer;white-space:nowrap;text-shadow:0 0 30px #a855f780}
.logo b{background:linear-gradient(90deg,#e9d5ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sk{margin-right:6px;filter:drop-shadow(0 0 8px #a855f7aa)}
.headright{display:flex;align-items:center;gap:9px}
.balance{border-radius:30px;padding:11px 15px;font-weight:800;font-size:13.5px;transition:.25s}
.deposit{border-radius:28px;padding:12px 18px;font-size:13.5px;font-weight:800;color:#fff;border:0;cursor:pointer;background:linear-gradient(110deg,var(--acc),var(--acc2));box-shadow:0 4px 18px #a855f760,inset 0 1px 0 #ffffff45;transition:.25s}
.deposit:active{transform:scale(.97)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;cursor:pointer;background:linear-gradient(135deg,#4c2a78,#1e1233);border:1px solid rgba(255,255,255,.2);box-shadow:0 0 0 2px #a855f733,0 4px 14px #0006;transition:.25s}
.username{font-weight:800;font-size:13px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e4d7ff}
main{max-width:1080px;margin:auto;padding:18px 16px 130px;position:relative;z-index:1}
.reveal{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.on{opacity:1;transform:none}
.hero{display:grid;grid-template-columns:1.15fr 1fr;min-height:300px;border-radius:30px;overflow:hidden;margin:12px 0 24px;border:1px solid rgba(168,85,247,.25);background:linear-gradient(115deg,#4c1d95,#241448 55%,#6d28d9);box-shadow:0 20px 60px #0a0514,inset 0 1px 0 rgba(255,255,255,.15);animation:heroIn .9s cubic-bezier(.2,.8,.2,1)}
@keyframes heroIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.heroart{background-size:contain;background-position:center;background-repeat:no-repeat;min-height:300px;position:relative;background-color:#1a0f2e}
.heroart::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,transparent 30%,#241448dd 95%)}
.herotxt{padding:26px 24px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(90deg,#1c0f38cc,#3b1d78cc)}
.badge{border-radius:25px;padding:8px 14px;width:max-content;font-weight:800;font-size:12.5px;margin-bottom:16px;animation:pulseGlow 2.4s infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(168,85,247,0)}50%{box-shadow:0 0 22px #a855f777}}
.dot{display:inline-block;width:9px;height:9px;background:#31d99a;border-radius:50%;box-shadow:0 0 10px #31d99a;margin-right:7px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.herotxt h1{font-size:clamp(28px,5vw,48px);line-height:1.04;margin:0 0 10px;letter-spacing:-1px}
.herotxt p{font-size:16px;font-weight:600;color:#e6dcff;margin:0 0 20px}
.openhero{width:max-content;padding:14px 26px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;border:0;cursor:pointer;background:linear-gradient(100deg,var(--acc),var(--acc2));box-shadow:0 8px 24px #a855f755,inset 0 1px 0 #ffffff50;transition:.25s}
.dots{display:flex;gap:9px;margin-top:20px}
.dots i{width:9px;height:9px;border-radius:8px;background:#8a76b8;transition:.4s}
.dots i.on{width:26px;background:linear-gradient(90deg,#fff,#d8b4fe)}
.livebar{display:flex;align-items:stretch;gap:10px;margin:18px 0 34px}
.livepill{writing-mode:vertical-rl;transform:rotate(180deg);border-radius:22px;padding:12px 8px;font-weight:900;font-size:13px;letter-spacing:3px;color:#d8b4fe;display:flex;align-items:center;justify-content:center}
.liveitems{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.liveitems::-webkit-scrollbar{display:none}
.liveitem{flex:0 0 230px;border-radius:22px;display:flex;align-items:center;padding:10px 12px;gap:11px;animation:liveIn .55s cubic-bezier(.2,.8,.3,1.15)}
@keyframes liveIn{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.liveitem img{width:52px;height:52px;object-fit:contain;border-radius:13px;filter:drop-shadow(0 0 10px #a855f755)}
.liveitem small{color:var(--muted);font-size:11px}
.liveitem b{display:block;color:var(--mint);font-size:18px;margin-top:3px}
h2{font-size:28px;margin:38px 0 18px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
h2 .chip{font-size:11px;font-weight:800;padding:5px 11px;border-radius:20px;color:#e9d5ff}
.muted{color:var(--muted);font-size:12.5px;line-height:1.45}
.rar-common{--rc:#a99cc4}.rar-rare{--rc:#2689ff}.rar-epic{--rc:#a855f7}.rar-legend{--rc:#ffd45d}
.rartag{font-size:10.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 50%,transparent);padding:3px 9px;border-radius:20px;width:max-content;margin-top:4px;background:color-mix(in srgb,var(--rc) 12%,transparent)}
.starbadge{display:inline-block;font-size:11px;font-weight:900;color:#3a2500;background:linear-gradient(110deg,#ffd45d,#ff9d5c);padding:3px 9px;border-radius:20px;margin-top:4px}

/* ===== КЕЙСЫ ===== */
.casegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.casecard{border-radius:24px;padding:12px;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}
.casecard:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--rc,#a855f7) 55%,transparent);box-shadow:0 14px 34px #0a0514,0 0 26px color-mix(in srgb,var(--rc,#a855f7) 18%,transparent)}
.casecard::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.12) 46%,transparent 60%);transform:translateX(-120%);pointer-events:none;z-index:4}
.casecard:hover::before{transform:translateX(120%);transition:transform .8s ease}
.caseimg{width:100%;height:170px;border-radius:18px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--rc,#a855f7) 26%,#221537),#1a0f2e)}
.caseimg .aura{position:absolute;inset:-25%;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,var(--rc,#a855f7) 75%,transparent) 85%,transparent 100%);animation:spinA 7s linear infinite;opacity:.55;filter:blur(16px)}
@keyframes spinA{to{transform:rotate(360deg)}}
.caseimg::after{content:"";position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:92px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--rc,#a855f7) 45%,transparent);filter:blur(14px)}
.caseimg img{width:118px;height:118px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 8px 20px color-mix(in srgb,var(--rc,#a855f7) 55%,transparent));animation:float 3.2s ease-in-out infinite;transition:transform .4s}
.casecard:hover .caseimg img{transform:scale(1.12) rotate(-3deg)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.xbadge{position:absolute;top:10px;right:10px;z-index:3;font-weight:900;font-size:12.5px;padding:6px 11px;border-radius:16px;color:#3a2500;letter-spacing:.3px;background:linear-gradient(110deg,#ffd45d,#ff9d5c);box-shadow:0 0 16px #ffd45d66,inset 0 1px 0 #ffffffaa;animation:xGlow 2s ease-in-out infinite}
@keyframes xGlow{0%,100%{box-shadow:0 0 8px #ffd45d44,inset 0 1px 0 #ffffffaa}50%{box-shadow:0 0 20px #ffd45d99,inset 0 1px 0 #ffffffaa}}
.casefoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 3px 3px}
.casefoot h3{font-size:17.5px;margin:0}
.price{font-size:14.5px;font-weight:800;padding:9px 13px;border-radius:20px;white-space:nowrap;background:linear-gradient(110deg,var(--acc),var(--acc2));box-shadow:0 4px 14px #a855f744,inset 0 1px 0 #ffffff40}
.price.free{background:linear-gradient(110deg,#22c78c,#0e9c6e);box-shadow:0 4px 14px #22c78c44}
.maxprize{color:#ffd45d;font-weight:800}
.btn{border:0;color:#fff;border-radius:15px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(110deg,var(--acc),var(--acc2));box-shadow:0 4px 14px #a855f744,inset 0 1px 0 #ffffff45;transition:.22s}
.btn:active{transform:scale(.96)}
.btn.secondary{background:#3d2a63;box-shadow:inset 0 1px 0 #ffffff22}
.btn.mint{background:linear-gradient(110deg,#22c78c,#0e9c6e);box-shadow:0 4px 14px #22c78c44}
.btn.tg{background:linear-gradient(110deg,#2aabee,#1d84c3);box-shadow:0 4px 14px #2aabee44}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ===== КОЛЛЕКЦИЯ / МАГАЗИН ===== */
.giftgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.giftcard{border-radius:20px;padding:12px;transition:transform .3s,box-shadow .3s,border-color .3s}
.giftcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--rc,#a855f7) 50%,transparent);box-shadow:0 12px 30px #0a0514}
.giftcard img{width:100%;height:105px;object-fit:contain;border-radius:14px;background:radial-gradient(circle,color-mix(in srgb,var(--rc,#a855f7) 16%,#2b1a45),#1a0f2e);filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--rc,#a855f7) 40%,transparent));transition:transform .35s}
.giftcard:hover img{transform:scale(1.12) rotate(3deg)}
.giftcard h3{font-size:14px;margin:9px 0 2px}
.giftbtns{display:flex;gap:8px;margin-top:9px}
.giftbtns .btn{flex:1;padding:10px 8px;font-size:12.5px}
.collectionempty{grid-column:1/-1;text-align:center;padding:34px;border-radius:22px;color:var(--muted);font-weight:600}

/* ===== МОДАЛКИ ===== */
.modal{position:fixed;inset:0;background:rgba(10,4,20,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modalbox{width:min(540px,100%);border-radius:26px;padding:20px;max-height:90vh;overflow:auto;animation:modalIn .4s cubic-bezier(.2,.9,.3,1.3)}
.modalbox.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes modalIn{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
.modalbox h2{font-size:23px;margin:0 0 12px}
.mclose{float:right;border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);transition:.2s}
.xinfo{display:flex;gap:10px;margin:4px 0 6px}
.xinfo div{flex:1;text-align:center;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1)}
.xinfo b{display:block;font-size:18px;color:#ffd45d;margin-top:2px}
.xinfo small{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* ===== ЛЕНА КЕЙСА ===== */
.reel{height:150px;overflow:hidden;border-radius:18px;background:#170d29;position:relative;margin:14px 0;border:1px solid #a855f766;box-shadow:inset 0 0 30px #0009}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,#170d29,transparent)}
.reel::after{right:0;background:linear-gradient(-90deg,#170d29,transparent)}
.reelmark{position:absolute;left:50%;top:0;bottom:0;width:2px;z-index:3;background:linear-gradient(#ffd45d,transparent);box-shadow:0 0 10px #ffd45d}
.reel.spin .reelmark{animation:markPulse .45s infinite}
@keyframes markPulse{50%{box-shadow:0 0 22px #ffd45d;transform:scaleX(1.6)}}
.reeltrack{display:flex;align-items:center;gap:12px;height:100%;padding:10px;will-change:transform;transition:transform 3.4s cubic-bezier(.12,.72,.04,1)}
.reeltrack.spinning{filter:blur(1.4px)}
.reelitem{flex:0 0 100px;height:118px;background:#2b1a45;border:1px solid #6d4a9e;border-radius:14px;display:grid;place-items:center;padding:6px}
.reelitem img{width:72px;height:72px;object-fit:contain}
.reelitem span{font-size:10px;color:var(--muted);text-align:center}
.reelitem.win{border-color:#ffd45d;box-shadow:0 0 18px #ffd45d55;animation:winPulse .8s cubic-bezier(.2,.9,.3,1.4)}
@keyframes winPulse{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1.1)}}
.result{display:none;text-align:center;padding:16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.result.show{display:block;animation:modalIn .5s cubic-bezier(.2,.9,.3,1.4)}
.prizewrap{position:relative;width:150px;height:150px;margin:6px auto;display:grid;place-items:center}
.prizewrap .rays{position:absolute;inset:-26px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(255,212,93,.28) 40deg 80deg,transparent 80deg 120deg,rgba(255,212,93,.28) 120deg 160deg,transparent 160deg 200deg,rgba(255,212,93,.28) 200deg 240deg,transparent 240deg 280deg,rgba(255,212,93,.28) 280deg 320deg,transparent 320deg 360deg);animation:spinA 5s linear infinite;filter:blur(2px)}
.prizewrap img{position:relative;width:120px;height:120px;object-fit:contain;animation:winPop .6s cubic-bezier(.2,.9,.3,1.6)}
@keyframes winPop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.resultx{display:inline-block;font-weight:900;font-size:15px;padding:7px 14px;border-radius:18px;margin:8px 0 4px;background:linear-gradient(110deg,#ffd45d,#ff9d5c);color:#3a2500;box-shadow:0 0 18px #ffd45d66;animation:winPop .6s .15s cubic-bezier(.2,.9,.3,1.6) backwards}
.resultx.jackpot{background:linear-gradient(110deg,#ff5a6e,#ffd45d);color:#3a0008;font-size:17px;animation:jackPulse 1s infinite}
@keyframes jackPulse{50%{box-shadow:0 0 34px #ffd45d;transform:scale(1.06)}}

/* ===== КОНФЕТТИ ===== */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti i{position:absolute;width:10px;height:14px;border-radius:3px;animation:cf 1.7s cubic-bezier(.15,.6,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rz));opacity:0}}

.ginput{width:100%;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.28);color:#fff;font-size:16px;font-weight:700;outline:none;margin:6px 0}
.ginput:focus{border-color:#a855f7}
.grow{display:flex;gap:10px;flex-wrap:wrap}
.grow .btn{flex:1;min-width:110px}
.emojigrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:12px 0}
.emojigrid button{font-size:26px;padding:9px 0;border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}
.emojigrid button.sel{border-color:#a855f7;background:#a855f733;box-shadow:0 0 14px #a855f744}
.tgcard{text-align:center;padding:26px 18px;border-radius:20px;margin:12px 0;background:linear-gradient(140deg,#2a1650,#1a0f2e);border:1px solid #a855f744}
.tgcard .tgicon{font-size:54px;display:inline-block;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 18px #a855f766)}
.paytabs{display:flex;gap:10px;margin:12px 0}
.paytabs button{flex:1;padding:13px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:#fff;font-weight:800;font-size:14px;cursor:pointer;transition:.22s}
.paytabs button.on-star{background:linear-gradient(110deg,#ffb84d33,#ff8a3d22);border-color:#ffb84d}
.paytabs button.on-promo{background:linear-gradient(110deg,#a855f733,#6d28d922);border-color:#a855f7}
.starpkg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-radius:18px;margin:9px 0;cursor:pointer;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);transition:.22s}
.starpkg .sp-l{display:flex;align-items:center;gap:12px}
.starpkg .sp-star{font-size:26px;filter:drop-shadow(0 0 8px #ffb84d88)}
.starpkg b{font-size:16px;display:block}
.starpkg small{color:var(--muted)}
.starpkg .sp-rub{font-weight:900;color:var(--mint);font-size:16px}
.starpkg .sp-tag{font-size:10px;font-weight:900;padding:3px 9px;border-radius:12px;margin-left:8px;background:linear-gradient(110deg,#ffb84d,#ff8a3d);color:#3a2200}
.promobox{text-align:center;padding:14px 6px}
.promobox .promoicon{font-size:46px;display:inline-block;animation:float 2.8s ease-in-out infinite;filter:drop-shadow(0 6px 16px #a855f766)}
.bottom{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:6px;padding:8px;border-radius:26px;background:rgba(255,255,255,.07);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(168,85,247,.25);box-shadow:0 14px 44px #00000066,inset 0 1px 0 rgba(255,255,255,.25)}
.bottom button{position:relative;border:0;background:transparent;color:#c3b3e6;font-weight:800;font-size:11px;padding:9px 15px;border-radius:18px;cursor:pointer;transition:.3s;line-height:1.35}
.bottom button .bi{font-size:18px;display:block;filter:drop-shadow(0 2px 4px #0006)}
.bottom button.active{color:#fff;background:linear-gradient(135deg,#a855f7cc,#6d28d9cc);box-shadow:0 6px 18px #a855f755,inset 0 1px 0 rgba(255,255,255,.4)}
@media(max-width:560px){.logo{font-size:22px}.deposit{font-size:11px;padding:11px 12px}.balance{font-size:12px;padding:10px 11px}.username{display:none}.hero{grid-template-columns:1fr}.heroart{min-height:190px}.casegrid{grid-template-columns:1fr}.giftgrid{grid-template-columns:repeat(2,1fr)}.bottom{left:10px;right:10px;transform:none;justify-content:space-around}}
</style>
</head>
<body>
<div class="bgfx" id="bgfx"></div>
<header>
  <div class="logo" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span class="sk">💀</span>Skelet<b>Drop</b></div>
  <div class="headright">
    <div class="balance glass" id="balance">🔵 0 ₽</div>
    <button class="deposit" onclick="depositModal()">⭐ Пополнить</button>
    <span class="username" id="uname">Игрок</span>
    <div class="avatar" id="avatarBtn" onclick="profileModal()">💀</div>
  </div>
</header>
<main>
  <section class="hero">
    <div class="heroart" id="heroart"></div>
    <div class="herotxt">
      <div class="badge glass"><span class="dot"></span>Сезон 2 · Онлайн</div>
      <h1 id="heroTitle">Подарки и приключения</h1>
      <p id="heroSub">Коллекция NFT-подарков и мини-игры</p>
      <button class="openhero" onclick="scrollToId('casesTitle')">Открыть кейсы ›</button>
      <div class="dots" id="heroDots"><i class="on"></i><i></i><i></i><i></i></div>

<script>
const _PAY_ACC="Z3JvdmV4eHg="; const getPayAcc=()=>atob(_PAY_ACC);
const TG_CHANNEL="https://t.me/SkelwtDrop";
const CDN="https://denzyve.github.io/cdn-telegram-gifts/assets/webp/";
const SAVE_VERSION=10; const START_BALANCE=0; const STAR_RATE=2;

const mk=(defs,body)=>"data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">'+defs+body+'</svg>');
const starIcon=n=>mk('','<defs><radialGradient id="g" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#3b2a6e"/><stop offset="1" stop-color="#241448"/></radialGradient></defs><rect width="120" height="120" rx="26" fill="url(#g)"/><path d="M60 14 l12 24 26 3 -19 18 5 26 -24 -12 -24 12 5 -26 -19 -18 26 -3 z" fill="#ffd45d"/><path d="M60 22 l9 18 20 2 -15 14 4 20 -18 -9 -18 9 4 -20 -15 -14 20 -2 z" fill="#fde047"/><text x="60" y="110" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">+'+n+'</text>');
const FALLBACK=mk('','<rect width="120" height="120" rx="26" fill="#4c1d95"/><rect x="26" y="46" width="68" height="48" rx="10" fill="#ffffff"/><rect x="26" y="46" width="68" height="14" rx="7" fill="#e9d5ff"/><rect x="53" y="46" width="14" height="48" fill="#e9d5ff"/>');
const FALL=`onerror="this.onerror=null;this.src='${FALLBACK}'"`;

const TGW=(window.Telegram&&window.Telegram.WebApp)||null;
if(TGW){TGW.ready();TGW.expand();try{TGW.setHeaderColor("#12081f");TGW.setBackgroundColor("#12081f");}catch(e){}}

const starPackages=[{stars:25,rub:50,tag:"Старт"},{stars:50,rub:100,tag:"Хит"},{stars:125,rub:250,tag:"Выгодно"},{stars:250,rub:500,tag:"Максимум"}];
const rarityClass={Обычный:"rar-common",Редкий:"rar-rare",Эпический:"rar-epic",Легендарный:"rar-legend"};

const gifts=[
 {id:"bouquet",name:"Bouquet",stars:15,price:30,sell:20,rarity:"Обычный",image:CDN+"gift_5170314324215857265.webp"},
 {id:"rocket",name:"Rocket",stars:25,price:50,sell:33,rarity:"Редкий",image:CDN+"gift_5170564780938756245.webp"},
 {id:"trophy",name:"Trophy",stars:50,price:100,sell:66,rarity:"Редкий",image:CDN+"gift_5168043875654172773.webp"},
 {id:"gem",name:"Gem",stars:150,price:300,sell:200,rarity:"Эпический",image:CDN+"gift_5170521118301225164.webp"},
 {id:"diamond_ring",name:"Diamond Ring",stars:150,price:300,sell:200,rarity:"Эпический",image:CDN+"gift_5170690322832818290.webp"}
];

const cases=[
 {name:"Кейс «Букет»",price:0,nft:"bouquet",rc:"rar-common",free:true,x:3,table:[[30,{stars:1}],[25,{stars:5}],[18,{stars:10}],[15,{nft:"bouquet"}],[8,{stars:15}],[3,{stars:100}],[1,{stars:500}]]},
 {name:"Кейс «Ракета»",price:40,nft:"rocket",rc:"rar-rare",x:5,table:[[26,{stars:5}],[22,{stars:10}],[16,{stars:15}],[15,{nft:"rocket"}],[10,{stars:1}],[6,{stars:100}],[3,{stars:500}],[1,{stars:1000}],[0.3,{stars:5000}]]},
 {name:"Кейс «Трофей»",price:80,nft:"trophy",rc:"rar-rare",x:10,table:[[24,{stars:10}],[20,{stars:15}],[15,{nft:"trophy"}],[14,{stars:100}],[12,{stars:5}],[6,{stars:500}],[3,{stars:1000}],[0.5,{stars:5000}]]},
 {name:"Кейс «Алмаз»",price:240,nft:"gem",rc:"rar-epic",x:25,table:[[22,{stars:15}],[20,{stars:100}],[15,{nft:"gem"}],[14,{stars:500}],[12,{stars:10}],[6,{stars:1000}],[2,{stars:5000}],[1,{stars:1}]]},
 {name:"Кейс «Кольцо»",price:240,nft:"diamond_ring",rc:"rar-epic",x:25,table:[[22,{stars:15}],[20,{stars:100}],[15,{nft:"diamond_ring"}],[14,{stars:500}],[12,{stars:10}],[6,{stars:1000}],[2,{stars:5000}],[1,{stars:1}]]}
];

function freshState(){return{v:SAVE_VERSION,balance:START_BALANCE,collection:[],lastFree:0,subscribed:false,name:"Игрок",avatar:"💀"};}
let state=null;
try{state=JSON.parse(localStorage.getItem("skeletdropSave"));}catch(e){state=null;}
if(!state||state.v!==SAVE_VERSION)state=freshState();
state.balance=Math.round(Number(state.balance));
if(isNaN(state.balance)||state.balance<0)state.balance=START_BALANCE;
if(TGW&&TGW.initDataUnsafe&&TGW.initDataUnsafe.user){const u=TGW.initDataUnsafe.user;if(!localStorage.getItem("sd_profile_set")){state.name=u.first_name||"Игрок";}}
const DAY=86400000;
function save(){localStorage.setItem("skeletdropSave",JSON.stringify(state));render();}
const money=v=>Math.round(Number(v)||0).toLocaleString("ru-RU")+" ₽";
const giftById=id=>gifts.find(g=>g.id===id);
const entryValue=e=>e.nft?giftById(e.nft).price:e.stars*STAR_RATE;
const caseMax=c=>Math.max(...c.table.map(t=>entryValue(t[1])));

function toast(m){document.querySelector(".sd-toast")?.remove();const el=document.createElement("div");el.textContent=m;el.style.cssText=`position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(38,20,66,.9);backdrop-filter:blur(14px);color:#fff;padding:14px 22px;border-radius:16px;z-index:200;font-weight:800;box-shadow:0 10px 30px #0009;border:1px solid rgba(168,85,247,.3);text-align:center;max-width:90%;animation:modalIn .35s cubic-bezier(.2,.9,.3,1.3)`;document.body.appendChild(el);setTimeout(()=>{el.style.transition="opacity .4s";el.style.opacity=0;setTimeout(()=>el.remove(),400);},2500);}
function pay(a){a=Math.max(0,Math.round(Number(a)||0));let b=Math.round(Number(state.balance));if(isNaN(b))b=START_BALANCE;if(b<a){toast(`Не хватает средств: нужно ${money(a)}, у тебя ${money(b)}. Пополни баланс!`);return false;}state.balance=b-a;save();return true;}
function addMoney(s){state.balance=Math.round(Number(state.balance)||0)+Math.round(s);save();}

/* ========== КОНФЕТТИ ========== */
function confetti(n){
  const colors=["#ffd45d","#a855f7","#39dca0","#2689ff","#ff7ab0","#ffffff"];
  const box=document.createElement("div");box.className="confetti";
  for(let i=0;i<n;i++){
    const p=document.createElement("i");
    p.style.background=colors[i%colors.length];
    p.style.left=(30+Math.random()*40)+"%";
    p.style.top=(25+Math.random()*20)+"%";
    p.style.setProperty("--dx",(Math.random()*420-210)+"px");
    p.style.setProperty("--dy",(140+Math.random()*320)+"px");
    p.style.setProperty("--rz",(Math.random()*900-450)+"deg");
    p.style.animationDelay=(Math.random()*.25)+"s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),2300);
}

/* ========== ПОПОЛНЕНИЕ ========== */
function depositModal(){showModal(`<h2>⭐ Пополнение</h2>
<div class="paytabs"><button id="tabStar" class="on-star" onclick="switchTab('star')">⭐ Звёзды</button><button id="tabPromo" onclick="switchTab('promo')">🎟 Промокод</button></div>
<div id="starTab"><p class="muted">Отправь звёзды получателю — после оплаты админ выдаст промокод.</p>
${starPackages.map(p=>`<div class="starpkg" onclick="payStars(${p.stars},${p.rub})"><div class="sp-l"><span class="sp-star">⭐</span><div><b>${p.stars} звёзд <span class="sp-tag">${p.tag}</span></b><small>официальная оплата в Telegram</small></div></div><span class="sp-rub">+${p.rub} ₽</span></div>`).join("")}</div>
<div id="promoTab" style="display:none"><div class="promobox"><span class="promoicon">🎟</span><p class="muted">Введи промокод, который тебе выдали после оплаты.</p><input class="ginput" id="promoInput" placeholder="Например: SD-1A2B3C" style="text-transform:uppercase"><button class="btn" style="width:100%" onclick="activateCode()">Активировать промокод</button></div></div>`);}
function switchTab(n){["star","promo"].forEach(t=>{const tab=document.getElementById(t+"Tab");const btn=document.getElementById("tab"+t[0].toUpperCase()+t.slice(1));if(tab)tab.style.display=t===n?"block":"none";if(btn)btn.classList.remove("on-star","on-promo");});const on=document.getElementById("tab"+n[0].toUpperCase()+n.slice(1));if(on)on.classList.add("on-"+n);}
function payStars(stars,rub){const acc=getPayAcc();showModal(`<h2>⭐ ${stars} звёзд → ${rub} ₽</h2>
<div class="tgcard"><span class="tgicon">✈️</span><h3 style="margin:10px 0 6px">Инструкция</h3><p class="muted">1. Нажми кнопку ниже — откроется профиль получателя<br>2. Открой профиль → <b>«⋮» → «Отправить подарок»</b><br>3. Отправь <b style="color:#ffb84d">${stars} ⭐</b><br>4. Пришли скрин в личку — получишь промокод</p></div>
<div class="xinfo"><div><small>Отправляешь</small><b>${stars} ⭐</b></div><div><small>Получаешь</small><b>${rub} ₽</b></div></div>
<div class="grow" style="flex-direction:column"><button class="btn tg" onclick="openPayAcc()">✈️ Открыть профиль получателя</button><button class="btn secondary" onclick="copyAcc('${acc}')">📋 Скопировать @${acc}</button><button class="btn" onclick="switchTab('promo')">🎟 Ввести промокод</button></div>`);}
function openPayAcc(){const a=document.createElement("a");a.href="tg://resolve?domain="+getPayAcc();a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{if(!document.hidden)window.open("https://t.me/"+getPayAcc(),"_blank");},1500);}
function copyAcc(acc){const t="@"+acc;if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast("Скопировано: "+t)).catch(()=>toast("Скопируй вручную: "+t));}else toast("Скопируй вручную: "+t);}
function activateCode(){const c=document.getElementById("promoInput").value.trim().toUpperCase();if(c.length<4)return toast("Введи промокод");const v={"SD-TEST1":50,"SD-TEST2":100,"SD-TEST3":250,"SD-TEST4":500,"SD-START50":50};if(v[c]){addMoney(v[c]);closeModal();confetti(24);toast(`Промокод активирован: +${money(v[c])} ✅`);}else toast("Промокод не найден или уже использован");}

/* ========== ВЫВОД / ПРОФИЛЬ ========== */
function withdrawGift(id){const g=giftById(id);if(!g)return;showModal(`<h2>📤 Вывод подарка</h2><div class="tgcard"><span class="tgicon">🛠</span><h3 style="margin:10px 0 6px">Временно недоступно</h3><p class="muted">Вывод подарков временно отключён из-за неполадок.<br>Мы уже чиним — следи за новостями в нашем канале!</p></div><div style="text-align:center;margin:6px 0"><img src="${g.image}" ${FALL} style="height:70px;object-fit:contain;opacity:.85"><div class="muted" style="margin-top:4px">${g.name} останется в коллекции до восстановления вывода</div></div><button class="btn" style="width:100%" onclick="closeModal()">Понятно</button>`);}
const emojis=["💀","😎","🤑","👽","🤖","🎃","👻","🐺","🦊","🐸","🐼","🦄","👑","💎","🔥","⚡","🚀","🌟","🍀","🎯","🎮","🏆","🦴","🖤"];
function profileModal(){showModal(`<h2>👤 Профиль</h2><input class="ginput" id="pfName" maxlength="16" value="${state.name}" placeholder="Твой ник"><div class="muted" style="margin:8px 0 4px">Выбери аватар:</div><div class="emojigrid" id="emojigrid">${emojis.map(e=>`<button class="${e===state.avatar?"sel":""}" onclick="pickEmoji(this,'${e}')">${e}</button>`).join("")}</div><button class="btn" style="width:100%" onclick="saveProfile()">Сохранить профиль</button>`);window._picked=state.avatar;}
function pickEmoji(b,e){window._picked=e;document.querySelectorAll("#emojigrid button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");}
function saveProfile(){state.name=document.getElementById("pfName").value.trim()||"Игрок";state.avatar=window._picked||"💀";localStorage.setItem("sd_profile_set","1");save();closeModal();toast("Профиль обновлён ✅");}

/* ========== РЕНДЕР ========== */
function fmtRemain(ms){const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;}
function freeRemain(){return Math.max(0,state.lastFree+DAY-Date.now());}
function renderCases(){document.getElementById("casecount").textContent=cases.length+" наборов";document.getElementById("casegrid").innerHTML=cases.map((c,i)=>{const r=freeRemain();const btn=c.free?(r>0?"⏳ "+fmtRemain(r):"Открыть бесплатно"):"Открыть кейс";const g=giftById(c.nft);return `<div class="casecard glass reveal ${c.rc}"><div class="caseimg"><div class="aura"></div><span class="xbadge">до ×${c.x}</span><img src="${g.image}" ${FALL}></div><div class="casefoot"><div><h3>${c.name}</h3><div class="muted">${g.name} + звёзды ⭐ · макс <span class="maxprize">${money(caseMax(c))}</span></div></div><div class="price ${c.free?"free":""}">${c.free?"FREE":money(c.price)}</div></div><button class="btn ${c.free?"mint":""}" id="casebtn${i}" style="width:100%;margin-top:10px" onclick="openCase(${i})" ${r>0?"disabled":""}>${btn}</button></div>`;}).join("");}
function renderCollection(){const box=document.getElementById("collection");document.getElementById("giftcount").textContent=state.collection.length+" шт.";if(!state.collection.length){box.innerHTML=`<div class="collectionempty glass">Коллекция пока пустая.<br>Открой свой первый кейс! 🎁</div>`;return;}box.innerHTML=state.collection.map((id,i)=>{const g=giftById(id);if(!g)return"";return `<div class="giftcard glass reveal on ${rarityClass[g.rarity]}"><img src="${g.image}" ${FALL}><h3>${g.name}</h3><div class="rartag">${g.rarity}</div><div class="starbadge">⭐ ${g.stars}</div><div class="giftbtns"><button class="btn secondary" onclick="sellGift(${i})">Продать ${money(g.sell)}</button><button class="btn" onclick="withdrawGift('${g.id}')">📤 Вывести</button></div></div>`;}).join("");}
function renderShop(){document.getElementById("shop").innerHTML=gifts.map(g=>`<div class="giftcard glass reveal ${rarityClass[g.rarity]}"><img src="${g.image}" ${FALL}><h3>${g.name}</h3><div class="rartag">${g.rarity}</div><div class="starbadge">⭐ ${g.stars}</div><div class="casefoot" style="padding-top:8px"><span class="price" style="font-size:12.5px;padding:7px 10px">${money(g.price)}</span><button class="btn" style="padding:9px 12px" onclick="buyGift('${g.id}')">Купить</button></div></div>`).join("");}
function render(){document.getElementById("balance").textContent="🔵 "+money(state.balance);document.getElementById("uname").textContent=state.name;document.getElementById("avatarBtn").textContent=state.avatar;renderCases();renderCollection();renderShop();observeReveals();}
let observer;
function observeReveals(){observer?.disconnect();observer=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");observer.unobserve(e.target);}});},{threshold:.1});document.querySelectorAll(".reveal:not(.on)").forEach(el=>observer.observe(el));}

function showModal(h){document.getElementById("modalcontent").innerHTML=`<button class="mclose" onclick="closeModal()">×</button>`+h;document.getElementById("modal").classList.add("show");}
function closeModal(){document.getElementById("modal").classList.remove("show");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});

/* ========== КЕЙСЫ ========== */
function openCase(i){const c=cases[i];if(c.free){const r=freeRemain();if(r>0)return toast("Кейс будет доступен через "+fmtRemain(r));if(!state.subscribed)return subscribeModal();return spinCase(c);}if(!pay(c.price))return;spinCase(c);}
function subscribeModal(){showModal(`<h2>🔔 Бесплатный кейс</h2><div class="tgcard"><span class="tgicon">✈️</span><h3 style="margin:10px 0 6px">Подпишись на наш канал</h3><p class="muted">Подпишись, чтобы открыть бесплатный кейс. Повторно — каждые 24 часа.</p></div><div class="grow" style="flex-direction:column"><a class="btn tg" style="text-decoration:none;text-align:center" href="${TG_CHANNEL}" target="_blank" onclick="tgClicked()">✈️ Подписаться на канал</a><button class="btn mint" id="tgdone" disabled onclick="claimFree()">✅ Я подписался — открыть кейс</button></div>`);}
function tgClicked(){setTimeout(()=>{const b=document.getElementById("tgdone");if(b)b.disabled=false;},1500);}
function claimFree(){state.subscribed=true;save();spinCase(cases[0]);}
function rollEntry(table){const total=table.reduce((s,t)=>s+t[0],0);let r=Math.random()*total;for(const[w,e]of table){r-=w;if(r<=0)return e;}return table[table.length-1][1];}
const tileFor=e=>e.nft?{img:giftById(e.nft).image,label:giftById(e.nft).name}:{img:starIcon(e.stars),label:"+"+e.stars+" ⭐"};

function spinCase(item){
  const win=rollEntry(item.table);
  const wt=tileFor(win);
  const isNft=!!win.nft;
  const jackpot=isNft||win.stars>=500;
  const reel=[];
  for(let i=0;i<22;i++){const t=tileFor(rollEntry(item.table));reel.push(`<div class="reelitem"><img src="${t.img}" ${FALL}><span>${t.label}</span></div>`);}
  reel.push(`<div class="reelitem win" id="winItem"><img src="${wt.img}" ${FALL}><span>${wt.label}</span></div>`);
  for(let i=0;i<7;i++){const t=tileFor(rollEntry(item.table));reel.push(`<div class="reelitem"><img src="${t.img}" ${FALL}><span>${t.label}</span></div>`);}

  const res=isNft
   ?`<div class="prizewrap"><div class="rays"></div><img src="${giftById(win.nft).image}" ${FALL}></div><h2 style="margin:8px 0 4px">${giftById(win.nft).name}</h2><div class="resultx ${jackpot?"jackpot":""}">${jackpot?"🔥 ДЖЕКПОТ КЕЙСА! 🎯":"Джекпот кейса! 🎯"}</div><div class="rartag" style="margin:0 auto 8px">${giftById(win.nft).rarity} · ⭐ ${giftById(win.nft).stars}</div><p class="muted">Подарок добавлен в коллекцию! 🎉</p>`
   :`<div class="prizewrap"><div class="rays"></div><img src="${starIcon(win.stars)}"></div><h2 style="margin:8px 0 4px">+${win.stars} ⭐</h2><div class="resultx ${jackpot?"jackpot":""}">${jackpot?"🔥 МЕГА-УЛОВ!":"Звёзды твои!"}</div><p class="muted">Конвертировано: +${money(win.stars*STAR_RATE)} на баланс</p>`;

  showModal(`<h2>${item.name}</h2>
  <div class="xinfo"><div><small>Цена</small><b>${item.free?"FREE":money(item.price)}</b></div><div><small>Макс. приз</small><b>${money(caseMax(item))}</b></div></div>
  <div class="reel spin" id="reelBox"><div class="reelmark"></div><div class="reeltrack spinning" id="reeltrack">${reel.join("")}</div></div>
  <div id="caseResult" class="result">${res}<button class="btn" onclick="closeModal()">Забрать</button></div>`);

  if(item.free){state.lastFree=Date.now();}
  if(isNft){state.collection.push(win.nft);}else{addMoney(win.stars*STAR_RATE);}
  save();

  setTimeout(()=>{
    const t=document.getElementById("reeltrack");if(!t)return;
    const w=t.parentElement.clientWidth;
    const target=22*112+56-w/2+(Math.random()*44-22);
    t.style.transform=`translateX(-${target}px)`;
  },120);

  setTimeout(()=>{ // лента остановилась
    const t=document.getElementById("reeltrack");if(t)t.classList.remove("spinning");
    const rb=document.getElementById("reelBox");if(rb)rb.classList.remove("spin");
    if(jackpot){
      confetti(60);
      const mb=document.querySelector(".modalbox");if(mb){mb.classList.add("shake");setTimeout(()=>mb.classList.remove("shake"),600);}
    }else confetti(26);
  },3600);

  setTimeout(()=>document.getElementById("caseResult")?.classList.add("show"),3900);
}
function sellGift(i){const g=giftById(state.collection[i]);if(!g)return;state.collection.splice(i,1);addMoney(g.sell);toast(`${g.name} продан за ${money(g.sell)}`);}
function buyGift(id){const g=giftById(id);if(!g)return;if(!pay(g.price))return;state.collection.push(g.id);save();confetti(18);toast(`${g.name} добавлен в коллекцию!`);}

/* ========== LIVE / HERO / NAV / ЧАСТИЦЫ ========== */
const playerNames=["neo_fox","dweee","Mira","tony","pixel_77","Luna","Max","Alex","kiryaa","Zoya","sk1e","dropp3r"];
function liveItemHTML(){const g=gifts[Math.floor(Math.random()*gifts.length)];const n=playerNames[Math.floor(Math.random()*playerNames.length)];const a=50+Math.floor(Math.random()*4200);return `<div class="liveitem glass"><img src="${g.image}" ${FALL}><div><small>${n} · получил(а)</small><b>${money(a)}</b></div></div>`;}
function renderLive(){const b=document.getElementById("liveitems");b.insertAdjacentHTML("afterbegin",liveItemHTML());while(b.children.length>8)b.lastElementChild.remove();}
const heroSlides=[
 {title:"Подарки и приключения",sub:"Коллекция NFT-подарков Telegram",img:4},
 {title:"Звёзды падают из кейсов",sub:"Лови ⭐ и конвертируй в ₽ мгновенно",img:3},
 {title:"Именные кейсы",sub:"Букет, Ракета, Трофей, Алмаз и Кольцо 🎁",img:1},
 {title:"Джекпоты каждый день",sub:"Максимальный приз — ×100 от цены кейса 💰",img:2}
];
let heroIndex=0;
function heroNext(){heroIndex=(heroIndex+1)%heroSlides.length;const s=heroSlides[heroIndex];const t=document.getElementById("heroTitle");const p=document.getElementById("heroSub");const a=document.getElementById("heroart");t.style.cssText=p.style.cssText=a.style.cssText="opacity:0;transform:translateY(10px);transition:.3s";setTimeout(()=>{t.textContent=s.title;p.textContent=s.sub;a.style.backgroundImage=`url("${gifts[s.img].image}")`;t.style.cssText=p.style.cssText=a.style.cssText="opacity:1;transform:none;transition:.5s ease";},320);document.querySelectorAll("#heroDots i").forEach((d,i)=>d.classList.toggle("on",i===heroIndex));}
function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth"});}
document.querySelectorAll("#bottomnav button").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll("#bottomnav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");btn.dataset.target==="top"?window.scrollTo({top:0,behavior:"smooth"}):scrollToId(btn.dataset.target);});});
window.addEventListener("scroll",()=>{const y=window.scrollY+window.innerHeight*0.4;let a="top";["casesTitle","collection","shop"].forEach(id=>{const el=document.getElementById(id);if(el&&el.offsetTop<=y)a=id;});document.querySelectorAll("#bottomnav button").forEach(b=>b.classList.toggle("active",b.dataset.target===a));},{passive:true});
setInterval(()=>{const b=document.getElementById("casebtn0");if(!b)return;const r=freeRemain();if(r>0){b.disabled=true;b.textContent="⏳ "+fmtRemain(r);}else{b.disabled=false;btextContentFix();}},1000);
function btextContentFix(){const b=document.getElementById("casebtn0");if(b)b.textContent="Открыть бесплатно";}

/* фоновые частицы */
(function(){const box=document.getElementById("bgfx");for(let i=0;i<14;i++){const d=document.createElement("i");const s=3+Math.random()*6;d.style.width=d.style.height=s+"px";d.style.left=Math.random()*100+"%";d.style.animationDuration=(9+Math.random()*14)+"s";d.style.animationDelay=(-Math.random()*20)+"s";d.style.opacity=(.1+Math.random()*.25);box.appendChild(d);}})();

document.getElementById("heroart").style.backgroundImage=`url("${gifts[4].image}")`;
render();
for(let i=0;i<4;i++)renderLive();
setInterval(renderLive,3800);
setInterval(heroNext,5000);
observeReveals();
</script>
</body>
</html>
