<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#12081f">
<title>SkeletDrop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#12081f;color:#f6f2ff;min-height:100vh;overflow-x:hidden}
header{position:sticky;top:0;z-index:100;background:rgba(18,8,31,0.95);backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(168,85,247,0.2);gap:8px}
.logo{font-size:22px;font-weight:900;color:#a855f7;white-space:nowrap}
.balance{background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.3);border-radius:20px;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn-deposit{background:linear-gradient(135deg,#a855f7,#6d28d9);border:none;color:white;padding:10px 16px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#4c2a78,#1e1233);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0}
main{padding:16px;padding-bottom:100px}
.hero{background:linear-gradient(135deg,#4c1d95,#6d28d9);border-radius:20px;padding:24px;margin-bottom:20px;min-height:180px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:26px;margin-bottom:8px}
.hero p{font-size:15px;opacity:0.9;margin-bottom:16px}
.hero button{background:white;color:#6d28d9;border:none;padding:12px 24px;border-radius:20px;font-weight:700;font-size:15px;cursor:pointer;width:fit-content}
h2{font-size:22px;margin:24px 0 16px;color:#e9d5ff}
.gamegrid,.casegrid,.giftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gamecard,.casecard,.giftcard{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.2);border-radius:16px;padding:12px;cursor:pointer;transition:transform 0.2s}
.gamecard:hover,.casecard:hover,.giftcard:hover{transform:translateY(-4px);border-color:rgba(168,85,247,0.5)}
.gamecard img,.casecard img,.giftcard img{width:100%;height:120px;object-fit:contain;border-radius:12px;margin-bottom:8px}
.gamecard h3,.casecard h3,.giftcard h3{font-size:14px;margin-bottom:4px}
.online{background:rgba(57,220,160,0.2);color:#39dca0;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:8px}
.price{background:linear-gradient(135deg,#a855f7,#6d28d9);padding:6px 12px;border-radius:12px;font-size:13px;font-weight:700;display:inline-block}
.price.free{background:linear-gradient(135deg,#22c78c,#0e9c6e)}
.xbadge{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,#ffd45d,#ff9d5c);color:#3a2500;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:900}
.casecard{position:relative}
.btn{background:linear-gradient(135deg,#a855f7,#6d28d9);border:none;color:white;padding:8px 16px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;width:100%;margin-top:8px}
.btn-secondary{background:rgba(255,255,255,0.1)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(18,8,31,0.95);backdrop-filter:blur(10px);border-top:1px solid rgba(168,85,247,0.2);display:flex;justify-content:space-around;padding:12px;z-index:100}
.bottom button{background:none;border:none;color:#b3a5d6;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottom button.active{color:#a855f7}
.bottom button .bi{font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.show{display:flex}
.modalbox{background:#1e1233;border-radius:20px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.close-btn{float:right;background:rgba(255,255,255,0.1);border:none;color:white;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(38,20,66,0.95);color:white;padding:12px 20px;border-radius:12px;font-weight:700;z-index:300;animation:fadeIn 0.3s;max-width:90%;text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.rartag{font-size:10px;font-weight:900;text-transform:uppercase;color:#a855f7;margin-bottom:4px}
</style>
</head>
<body>

<header>
  <div class="logo">💀 SkeletDrop</div>
  <div class="balance" id="balance">🔵 0 ₽</div>
  <button class="btn-deposit" onclick="showDeposit()">⭐ Пополнить</button>
  <div class="avatar" id="avatarBtn" onclick="showProfile()">💀</div>
</header>

<main>
  <div class="hero">
    <h1>Подарки и приключения</h1>
    <p>Коллекция NFT-подарков и мини-игры</p>
    <button onclick="scrollToCases()">Открыть кейсы ›</button>
  </div>

  <h2>🎮 Игры</h2>
  <div class="gamegrid" id="gamegrid"></div>

  <h2 id="casesTitle">📦 Кейсы</h2>
  <div class="casegrid" id="casegrid"></div>

  <h2>🎁 Коллекция</h2>
  <div class="giftgrid" id="collection"></div>

  <h2>🛒 Магазин</h2>
  <div class="giftgrid" id="shop"></div>
</main>

<div class="bottom">
  <button class="active" onclick="scrollTo(0,0)"><span class="bi">⌂</span>Главная</button>
  <button onclick="scrollToId('gamegrid')"><span class="bi">▣</span>Игры</button>
  <button onclick="scrollToCases()"><span class="bi">◇</span>Кейсы</button>
  <button onclick="scrollToId('collection')"><span class="bi">▤</span>Коллекция</button>
</div>

<div class="modal" id="modal">
  <div class="modalbox" id="modalcontent"></div>
</div>

<script>
// ================= НАСТРОЙКИ =================
const CHECK_SERVER = "https://skeletdrop-bot666.onrender.com";
const CDN = "https://denzyve.github.io/cdn-telegram-gifts/assets/webp/";
const FALLBACK = CDN + "gift_5170564780938756245.webp";
const FALL = `onerror="this.src='${FALLBACK}'"`;

// ================= ДАННЫЕ =================
const gifts = [
  {id:"rocket",name:"Rocket",price:15,sell:10,rarity:"Обычный",image:CDN+"gift_5170564780938756245.webp"},
  {id:"bouquet",name:"Bouquet",price:25,sell:16,rarity:"Обычный",image:CDN+"gift_5170314324215857265.webp"},
  {id:"trophy",name:"Trophy",price:49,sell:32,rarity:"Редкий",image:CDN+"gift_5168043875654172773.webp"},
  {id:"diamond",name:"Diamond Ring",price:89,sell:58,rarity:"Эпический",image:CDN+"gift_5170690322832818290.webp"},
  {id:"gem",name:"Gem",price:150,sell:100,rarity:"Эпический",image:CDN+"gift_5170521118301225164.webp"},
  {id:"snowman",name:"Snowman",price:300,sell:195,rarity:"Легендарный",image:CDN+"gift_5166203099099178504.webp"}
];

const games = [
  {name:"Апгрейд",online:204,image:gifts[2].image},
  {name:"Шторм",online:20,image:gifts[4].image},
  {name:"Ракетка",online:79,image:gifts[0].image},
  {name:"Кейсы",online:1051,image:gifts[3].image},
  {name:"Коровка",online:113,image:gifts[1].image},
  {name:"Рейс",online:50,image:gifts[4].image}
];

const cases = [
  {name:"Бесплатный кейс",price:0,gift:"rocket",image:gifts[0].image,free:true,x:3},
  {name:"Кейс «Старт»",price:15,gift:"bouquet",image:gifts[1].image,x:5},
  {name:"Кейс «Трофей»",price:49,gift:"trophy",image:gifts[2].image,x:10},
  {name:"Кейс «Алмаз»",price:89,gift:"diamond",image:gifts[3].image,x:25},
  {name:"Кейс «Самоцвет»",price:150,gift:"gem",image:gifts[4].image,x:50},
  {name:"Кейс «Легенда»",price:300,gift:"snowman",image:gifts[5].image,x:100}
];

// ================= СОСТОЯНИЕ =================
let state = {balance:0,collection:[],subscribed:false,name:"Игрок",avatar:"💀"};
try{
  const saved = localStorage.getItem("skeletdropSave");
  if(saved) state = {...state,...JSON.parse(saved)};
}catch(e){}

const money = v => Math.round(v||0).toLocaleString("ru-RU")+" ₽";
const giftById = id => gifts.find(g=>g.id===id);

// ================= TELEGRAM INIT =================
let tgInitData = "";
if(window.Telegram && window.Telegram.WebApp){
  try{
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    tgInitData = window.Telegram.WebApp.initData || "";
    if(window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user){
      const u = window.Telegram.WebApp.initDataUnsafe.user;
      if(!localStorage.getItem("sd_profile_set")){
        state.name = u.first_name || "Игрок";
      }
    }
  }catch(e){console.error("TG init error:",e)}
}
console.log("✅ Telegram WebApp:", !!window.Telegram?.WebApp);
console.log("✅ initData длина:", tgInitData.length);

// ================= ОТРИСОВКА =================
function render(){
  document.getElementById("balance").textContent = "🔵 "+money(state.balance);
  document.getElementById("avatarBtn").textContent = state.avatar;
  
  document.getElementById("gamegrid").innerHTML = games.map((g,i)=>`
    <div class="gamecard" onclick="openGame(${i})">
      <img src="${g.image}" ${FALL}>
      <div class="online">● ${g.online} играют</div>
      <h3>${g.name}</h3>
    </div>
  `).join("");
  
  document.getElementById("casegrid").innerHTML = cases.map((c,i)=>`
    <div class="casecard">
      <span class="xbadge">×${c.x}</span>
      <img src="${c.image}" ${FALL}>
      <h3>${c.name}</h3>
      <div class="price ${c.free?'free':''}">${c.free?'FREE':money(c.price)}</div>
      <button class="btn" onclick="openCase(${i})">${c.free?'Открыть бесплатно':'Открыть'}</button>
    </div>
  `).join("");
  
  if(state.collection.length===0){
    document.getElementById("collection").innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#b3a5d6">Коллекция пуста<br>Открой первый кейс!</div>';
  }else{
    document.getElementById("collection").innerHTML = state.collection.map((id,i)=>{
      const g = giftById(id);
      return `<div class="giftcard">
        <img src="${g.image}" ${FALL}>
        <h3>${g.name}</h3>
        <div class="rartag">${g.rarity}</div>
        <button class="btn btn-secondary" onclick="sellGift(${i})">Продать ${money(g.sell)}</button>
      </div>`;
    }).join("");
  }
  
  document.getElementById("shop").innerHTML = gifts.map(g=>`
    <div class="giftcard">
      <img src="${g.image}" ${FALL}>
      <h3>${g.name}</h3>
      <div class="rartag">${g.rarity}</div>
      <div class="price">${money(g.price)}</div>
      <button class="btn" onclick="buyGift('${g.id}')">Купить</button>
    </div>
  `).join("");
}

function save(){
  localStorage.setItem("skeletdropSave",JSON.stringify(state));
  render();
}

function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

function showModal(html){
  document.getElementById("modalcontent").innerHTML = `<button class="close-btn" onclick="closeModal()">×</button>`+html;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}

function pay(amount){
  if(state.balance<amount){
    toast(`Не хватает ${money(amount-state.balance)}`);
    return false;
  }
  state.balance -= amount;
  save();
  return true;
}

function addMoney(sum){
  state.balance += sum;
  save();
}

// ================= ПОПОЛНЕНИЕ С ОТЛАДКОЙ =================
function showDeposit(){
  showModal(`
    <h2>⭐ Пополнение</h2>
    <p style="margin:16px 0;color:#b3a5d6">Выбери пакет звёзд:</p>
    <div style="display:flex;flex-direction:column;gap:12px">
      <button class="btn" onclick="payStars(25,50)">25 звёзд → 50 ₽</button>
      <button class="btn" onclick="payStars(50,100)">50 звёзд → 100 ₽</button>
      <button class="btn" onclick="payStars(125,250)">125 звёзд → 250 ₽</button>
      <button class="btn" onclick="payStars(250,500)">250 звёзд → 500 ₽</button>
    </div>
    <p style="margin-top:16px;font-size:11px;color:#b3a5d6;text-align:center">
      Сервер: ${CHECK_SERVER}<br>
      initData: ${tgInitData ? '✅ есть ('+tgInitData.length+' симв.)' : '❌ нет'}
    </p>
  `);
}

async function payStars(stars,rub){
  // Проверка 1: Telegram WebApp
  if(!window.Telegram || !window.Telegram.WebApp){
    alert("❌ Telegram WebApp не найден\nОткрой игру через бота, а не по прямой ссылке");
    return;
  }
  
  // Проверка 2: initData
  if(!tgInitData){
    alert("❌ initData пустой\nTelegram не передал данные авторизации\n\nОткрой игру через кнопку '🎮 Играть' в боте");
    return;
  }
  
  // Проверка 3: сервер
  if(!CHECK_SERVER){
    alert("❌ CHECK_SERVER не указан");
    return;
  }
  
  alert(`✅ Подготовка оплаты:\n⭐ ${stars} звёзд\n💰 ${rub} ₽\n🔗 ${CHECK_SERVER}\n📏 initData: ${tgInitData.length} симв.`);
  
  try{
    const r = await fetch(CHECK_SERVER+"/api/invoice",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        initData: tgInitData,
        pkg: "dep"+rub
      })
    });
    
    const text = await r.text();
    alert("📡 Ответ сервера (статус "+r.status+"):\n"+text);
    
    const j = JSON.parse(text);
    
    if(!j.ok || !j.link){
      alert("❌ Сервер вернул ошибку:\n"+JSON.stringify(j));
      return;
    }
    
    alert("✅ Счёт создан!\nСсылка: "+j.link+"\n\nОткрываю оплату...");
    
    window.Telegram.WebApp.openInvoice(j.link, status=>{
      alert("💳 Статус оплаты: "+status);
      if(status==="paid"){
        addMoney(rub);
        toast("+"+money(rub)+" ✅");
        closeModal();
      }else if(status==="cancelled"){
        toast("Оплата отменена");
      }else if(status==="failed"){
        toast("Оплата не прошла");
      }else{
        toast("Статус: "+status);
      }
    });
  }catch(e){
    alert("❌ Ошибка:\n"+e.message+"\n\n"+e.stack);
  }
}

// ================= КЕЙСЫ =================
function openCase(i){
  const c = cases[i];
  if(c.price>0 && !pay(c.price)) return;
  const gift = giftById(c.gift);
  state.collection.push(gift.id);
  save();
  showModal(`
    <h2>🎉 ${c.name}</h2>
    <img src="${gift.image}" style="width:100%;max-width:200px;margin:20px auto;display:block" ${FALL}>
    <h3 style="text-align:center">${gift.name}</h3>
    <p style="text-align:center;color:#39dca0;font-size:18px;margin:12px 0">×${c.x} — ${gift.rarity}</p>
    <button class="btn" onclick="closeModal()">Забрать</button>
  `);
}

function sellGift(i){
  const g = giftById(state.collection[i]);
  state.collection.splice(i,1);
  addMoney(g.sell);
  toast("Продано за "+money(g.sell));
}

function buyGift(id){
  const g = giftById(id);
  if(!pay(g.price)) return;
  state.collection.push(g.id);
  save();
  toast(g.name+" куплен!");
}

// ================= ПРОФИЛЬ =================
function showProfile(){
  showModal(`
    <h2>👤 Профиль</h2>
    <input type="text" id="pfName" value="${state.name}" placeholder="Ник" style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(168,85,247,0.3);background:rgba(0,0,0,0.3);color:white;margin:16px 0;font-size:16px">
    <p style="margin:12px 0;color:#b3a5d6">Аватар:</p>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0">
      ${["💀","😎","🤑","👽","🤖","🎃","👻","🐺","🦊","🐸","👑","💎"].map(e=>`
        <button onclick="setAvatar('${e}')" style="font-size:24px;padding:8px;background:${e===state.avatar?'rgba(168,85,247,0.3)':'rgba(255,255,255,0.05)'};border:1px solid ${e===state.avatar?'#a855f7':'transparent'};border-radius:12px;cursor:pointer">${e}</button>
      `).join("")}
    </div>
    <button class="btn" onclick="saveProfile()">Сохранить</button>
  `);
}

function setAvatar(e){
  state.avatar = e;
  save();
  showProfile();
}

function saveProfile(){
  state.name = document.getElementById("pfName").value || "Игрок";
  localStorage.setItem("sd_profile_set","1");
  save();
  closeModal();
  toast("Профиль обновлён");
}

// ================= ИГРЫ =================
function openGame(i){
  const g = games[i];
  showModal(`
    <h2>${g.name}</h2>
    <img src="${g.image}" style="width:100%;max-width:200px;margin:20px auto;display:block" ${FALL}>
    <p style="color:#b3a5d6;margin:16px 0">Игра в разработке</p>
    <button class="btn" onclick="closeModal()">Закрыть</button>
  `);
}

// ================= НАВИГАЦИЯ =================
function scrollToCases(){
  document.getElementById("casesTitle").scrollIntoView({behavior:"smooth"});
}
function scrollToId(id){
  document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

// ================= ЗАПУСК =================
console.log("✅ Игра загружена");
console.log("🔗 Сервер:", CHECK_SERVER);
console.log("👤 Игрок:", state.name);
console.log("💰 Баланс:", state.balance);
render();
</script>

</body>
</html>
