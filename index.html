<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12081f">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>SkeletDrop — Cases</title>
<style>
:root{
  --bg:#12081f;--acc:#a855f7;--acc2:#6d28d9;--mint:#39dca0;--gold:#ffd45d;
  --red:#ff5a6e;--blue:#2689ff;--magenta:#ff7ab0;--muted:#b3a5d6;--txt:#f6f2ff;
  --glass:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);font-family:'Segoe UI',Arial,sans-serif;overflow-x:hidden;
  background:radial-gradient(900px 460px at 88% -10%,#6d28d955,transparent),
             radial-gradient(700px 400px at -10% 38%,#a855f72e,transparent),
             radial-gradient(560px 380px at 62% 92%,#4c1d9533,transparent),var(--bg)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:#170d29}
::-webkit-scrollbar-thumb{background:linear-gradient(#a855f7,#6d28d9);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#c084fc}

.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgfx i{position:absolute;bottom:-10px;border-radius:50%;background:var(--acc);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}

.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 22px #00000045;position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0 0 62% 0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent);pointer-events:none;border-radius:inherit}

header{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;position:sticky;top:0;z-index:40;
  background:rgba(18,8,31,.72);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border-bottom:1px solid rgba(168,85,247,.18)}
.logo{font-size:21px;font-weight:900;letter-spacing:-1px;cursor:pointer;white-space:nowrap;text-shadow:0 0 22px #a855f780}
.logo b{background:linear-gradient(90deg,#e9d5ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sk{margin-right:4px;filter:drop-shadow(0 0 6px #a855f7aa)}
.headright{display:flex;align-items:center;gap:6px}
.balance{border-radius:22px;padding:7px 10px;font-weight:800;font-size:11.5px;white-space:nowrap}
.deposit{border-radius:20px;padding:8px 11px;font-size:11.5px;font-weight:800;color:#fff;border:0;cursor:pointer;white-space:nowrap;
  background:linear-gradient(110deg,var(--acc),var(--acc2));box-shadow:0 3px 13px #a855f760,inset 0 1px 0 #ffffff45;transition:.2s}
.deposit:active{transform:scale(.95)}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;transition:.2s}
.iconbtn:active{transform:scale(.9)}

main{max-width:1040px;margin:auto;padding:10px 10px 84px;position:relative;z-index:1}
.reveal{opacity:0;transform:translateY(20px) scale(.99);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.on{opacity:1;transform:none}

.hero{display:grid;grid-template-columns:1.25fr .85fr;min-height:148px;border-radius:20px;overflow:hidden;margin:6px 0 12px;
  border:1px solid rgba(168,85,247,.25);background:linear-gradient(115deg,#4c1d95,#241448 55%,#6d28d9);
  box-shadow:0 12px 36px #0a0514,inset 0 1px 0 rgba(255,255,255,.15);animation:heroIn .8s cubic-bezier(.2,.8,.2,1)}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.heroart{background-size:contain;background-position:center;background-repeat:no-repeat;min-height:148px;position:relative;background-color:#1a0f2e}
.heroart::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,transparent 32%,#241448dd 96%)}
.herotxt{padding:14px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(90deg,#1c0f38cc,#3b1d78cc)}
.badge{border-radius:18px;padding:5px 9px;width:max-content;font-weight:800;font-size:10px;margin-bottom:9px;animation:pulseGlow 2.4s infinite}
@keyframes pulseGlow{50%{box-shadow:0 0 16px #a855f777}}
.dot{display:inline-block;width:7px;height:7px;background:#31d99a;border-radius:50%;box-shadow:0 0 8px #31d99a;margin-right:5px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.herotxt h1{font-size:clamp(18px,4.4vw,30px);line-height:1.06;margin:0 0 6px;letter-spacing:-.6px}
.herotxt p{font-size:11.5px;font-weight:600;color:#e6dcff;margin:0 0 11px}
.openhero{width:max-content;padding:9px 15px;border-radius:18px;font-size:12px;font-weight:800;color:#fff;border:0;cursor:pointer;
  background:linear-gradient(100deg,var(--acc),var(--acc2));box-shadow:0 5px 16px #a855f755,inset 0 1px 0 #ffffff50}
.openhero:active{transform:scale(.96)}
.dots{display:flex;gap:6px;margin-top:11px}
.dots i{width:6px;height:6px;border-radius:6px;background:#8a76b8;transition:.4s}
.dots i.on{width:18px;background:linear-gradient(90deg,#fff,#d8b4fe)}

/* LIVE открытия — с картинкой NFT или звезды рядом с текстом */
.livebar{display:flex;align-items:center;gap:8px;margin:10px 0 16px}
.livepill{writing-mode:vertical-rl;transform:rotate(180deg);border-radius:12px;padding:7px 4px;font-weight:900;font-size:9.5px;letter-spacing:2px;color:#d8b4fe;display:flex;align-items:center;flex-shrink:0}
.liveitems{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px 0;flex:1}
.liveitems::-webkit-scrollbar{display:none}
.liveitem{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:2px 12px;animation:liveIn .5s cubic-bezier(.2,.8,.3,1.15)}
.liveitem + .liveitem{border-left:1px solid rgba(255,255,255,.09)}
.liveitem img{width:30px;height:30px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.liveitem small{display:block;color:var(--muted);font-size:10px;white-space:nowrap}
.liveitem b{display:block;font-size:12.5px;margin-top:1px;white-space:nowrap;color:var(--mint)}
.liveitem b.giftprice{color:var(--gold)}
@keyframes liveIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

h2{font-size:19px;margin:20px 0 10px;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
h2 .chip{font-size:9.5px;font-weight:800;padding:4px 8px;border-radius:14px;color:#e9d5ff}
.muted{color:var(--muted);font-size:10.5px;line-height:1.4}

/* Новости — только текст, без картинок */
.newslist{display:flex;flex-direction:column}
.newsitem{padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#e6dcff;line-height:1.45}
.newsitem:last-child{border-bottom:0}
.newsitem .nd{display:block;color:var(--acc);font-size:9.5px;font-weight:800;letter-spacing:.4px;margin-bottom:2px}

.rar-common{--rc:#a99cc4}.rar-rare{--rc:#2689ff}.rar-epic{--rc:#a855f7}.rar-legend{--rc:#ffd45d}
.rartag{font-size:8.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:var(--rc);
  border:1px solid color-mix(in srgb,var(--rc) 50%,transparent);padding:2px 6px;border-radius:12px;width:max-content;margin-top:3px;background:color-mix(in srgb,var(--rc) 12%,transparent)}
.starbadge{display:inline-block;font-size:9px;font-weight:900;color:#3a2500;background:linear-gradient(110deg,#ffd45d,#ff9d5c);padding:2px 6px;border-radius:12px;margin-top:3px}

.casegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.casecard{border-radius:16px;padding:7px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.casecard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--rc,#a855f7) 55%,transparent);box-shadow:0 10px 24px #0a0514}
.casecard::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,transparent 32%,rgba(255,255,255,.12) 47%,transparent 62%);transform:translateX(-120%);pointer-events:none;z-index:4}
.casecard:hover::before{transform:translateX(120%);transition:transform .7s ease}
.caseimg{width:100%;height:104px;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--rc,#a855f7) 26%,#221537),#1a0f2e)}
.caseimg .aura{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,var(--rc,#a855f7) 75%,transparent) 85%,transparent 100%);animation:spinA 7s linear infinite;opacity:.5;filter:blur(13px)}
@keyframes spinA{to{transform:rotate(360deg)}}
.caseimg::after{content:"";position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:64px;height:11px;border-radius:50%;background:color-mix(in srgb,var(--rc,#a855f7) 45%,transparent);filter:blur(11px)}
.caseimg img{width:76px;height:76px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 5px 13px color-mix(in srgb,var(--rc,#a855f7) 55%,transparent));animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.xbadge{position:absolute;top:6px;right:6px;z-index:3;font-weight:900;font-size:9px;padding:4px 7px;border-radius:11px;color:#3a2500;
  background:linear-gradient(110deg,#ffd45d,#ff9d5c);box-shadow:0 0 11px #ffd45d66;animation:xGlow 2s infinite;white-space:nowrap}
@keyframes xGlow{50%{box-shadow:0 0 17px #ffd45d99}}
.casefoot{display:flex;align-items:flex-start;justify-content:space-between;gap:5px;padding:7px 2px 2px}
.casefoot h3{font-size:12.5px;margin:0 0 2px;line-height:1.15}
.price{font-size:11px;font-weight:800;padding:5px 8px;border-radius:13px;white-space:nowrap;background:linear-gradient(110deg,var(--acc),var(--acc2));box-shadow:0 3px 9px #a855f744}
.price.free{background:linear-gradient(110deg,#22c78c,#0e9c6e)}
.maxprize{color:#ffd45d;font-weight:800}

.btn{border:0;color:#fff;border-radius:11px;padding:8px 10px;font-weight:800;font-size:11.5px;cursor:pointer;
  background:linear-gradient(110deg,var(--acc),var(--acc2));box-shadow:0 3px 10px #a855f744,inset 0 1px 0 #ffffff45;transition:.18s;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.96)}
.btn.secondary{background:#3d2a63;box-shadow:inset 0 1px 0 #ffffff22}
.btn.mint{background:linear-gradient(110deg,#22c78c,#0e9c6e)}
.btn.tg{background:linear-gradient(110deg,#2aabee,#1d84c3)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}

.giftgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.giftcard{border-radius:14px;padding:7px;transition:transform .25s,border-color .25s}
.giftcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--rc,#a855f7) 50%,transparent)}
.giftcard img{width:100%;height:66px;object-fit:contain;border-radius:10px;background:radial-gradient(circle,color-mix(in srgb,var(--rc,#a855f7) 16%,#2b1a45),#1a0f2e)}
.giftcard h3{font-size:11px;margin:6px 0 1px}
.giftbtns{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.giftbtns .btn{padding:6px 5px;font-size:10px}
.collectionempty{grid-column:1/-1;text-align:center;padding:22px;border-radius:16px;color:var(--muted);font-weight:600;font-size:12px}

.modal{position:fixed;inset:0;background:rgba(10,4,20,.8);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:60;display:none;align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.modalbox{width:min(460px,100%);border-radius:20px;padding:15px;max-height:90vh;overflow:auto;animation:modalIn .35s cubic-bezier(.2,.9,.3,1.3)}
.modalbox.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes modalIn{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
.modalbox h2{font-size:18px;margin:0 0 9px}
.mclose{float:right;border:0;color:#fff;width:29px;height:29px;border-radius:50%;font-size:16px;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.xinfo{display:flex;gap:7px;margin:3px 0 5px}
.xinfo div{flex:1;text-align:center;padding:7px;border-radius:11px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1)}
.xinfo b{display:block;font-size:14px;color:#ffd45d;margin-top:1px}
.xinfo small{color:var(--muted);font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}

.depblock{display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;margin:9px 0}
.dephead{display:flex;align-items:center;gap:10px}
.depicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#3b2a6e,#241448);flex-shrink:0;border:1px solid rgba(168,85,247,.3)}
.dephead b{font-size:13px;display:block;margin-bottom:2px}

.reel{height:118px;overflow:hidden;border-radius:14px;background:#170d29;position:relative;margin:10px 0;border:1px solid #a855f766;box-shadow:inset 0 0 22px #0009}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:46px;z-index:2;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,#170d29,transparent)}
.reel::after{right:0;background:linear-gradient(-90deg,#170d29,transparent)}
.reelmark{position:absolute;left:50%;top:0;bottom:0;width:2px;z-index:3;background:linear-gradient(#ffd45d,transparent);box-shadow:0 0 8px #ffd45d}
.reel.spin .reelmark{animation:markPulse .45s infinite}
@keyframes markPulse{50%{box-shadow:0 0 18px #ffd45d;transform:scaleX(1.6)}}
.reeltrack{display:flex;align-items:center;gap:10px;height:100%;padding:8px;will-change:transform;transition:transform 3.4s cubic-bezier(.12,.72,.04,1)}
.reeltrack.spinning{filter:blur(1.2px)}
.reelitem{flex:0 0 84px;height:96px;background:#2b1a45;border:1px solid #6d4a9e;border-radius:11px;display:grid;place-items:center;padding:5px}
.reelitem img{width:54px;height:54px;object-fit:contain}
.reelitem span{font-size:8.5px;color:var(--muted);text-align:center}
.reelitem.win{border-color:#ffd45d;box-shadow:0 0 14px #ffd45d55;animation:winPulse .8s}
@keyframes winPulse{45%{transform:scale(1.2)}100%{transform:scale(1.08)}}
.result{display:none;text-align:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.result.show{display:block;animation:modalIn .45s}
.prizewrap{position:relative;width:118px;height:118px;margin:4px auto;display:grid;place-items:center}
.prizewrap .rays{position:absolute;inset:-20px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(255,212,93,.28) 40deg 80deg,transparent 80deg 120deg,rgba(255,212,93,.28) 120deg 160deg,transparent 160deg 200deg,rgba(255,212,93,.28) 200deg 240deg,transparent 240deg 280deg,rgba(255,212,93,.28) 280deg 320deg,transparent 320deg 360deg);animation:spinA 5s linear infinite}
.prizewrap img{position:relative;width:94px;height:94px;object-fit:contain;animation:winPop .55s}
@keyframes winPop{from{transform:scale(0) rotate(-24deg)}to{transform:none}}
.resultx{display:inline-block;font-weight:900;font-size:12.5px;padding:5px 11px;border-radius:14px;margin:6px 0 3px;background:linear-gradient(110deg,#ffd45d,#ff9d5c);color:#3a2500}
.resultx.jackpot{background:linear-gradient(110deg,#ff5a6e,#ffd45d);color:#3a0008;font-size:14px;animation:jackPulse 1s infinite}
@keyframes jackPulse{50%{box-shadow:0 0 26px #ffd45d;transform:scale(1.05)}}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti i{position:absolute;width:8px;height:11px;border-radius:2px;animation:cf 1.7s cubic-bezier(.15,.6,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rz));opacity:0}}

.ginput{width:100%;padding:10px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.28);color:#fff;font-size:14px;font-weight:700;outline:none;margin:5px 0}
.ginput:focus{border-color:#a855f7}
.grow{display:flex;gap:8px;flex-wrap:wrap}
.grow .btn{flex:1;min-width:100px}
.tgcard{text-align:center;padding:16px 12px;border-radius:15px;margin:9px 0;background:linear-gradient(140deg,#2a1650,#1a0f2e);border:1px solid #a855f744}
.tgcard .tgicon{font-size:38px;display:inline-block;animation:float 2.6s infinite}
.tgcard h3{font-size:14px;margin:7px 0 5px}

.bottom{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:5px;border-radius:19px;
  background:rgba(255,255,255,.07);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(168,85,247,.25);box-shadow:0 10px 30px #00000066}
.bottom button{border:0;background:transparent;color:#c3b3e6;font-weight:800;font-size:9.5px;padding:6px 11px;border-radius:14px;cursor:pointer;line-height:1.25;transition:.25s}
.bottom button .bi{font-size:15px;display:block}
.bottom button.active{color:#fff;background:linear-gradient(135deg,#a855f7cc,#6d28d9cc);box-shadow:0 4px 13px #a855f755}

@media(min-width:700px){
  .casegrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .giftgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .hero{min-height:170px}.heroart{min-height:170px}
  h2{font-size:22px}
}
@media(max-width:400px){
  .logo{font-size:18px}
  .deposit{font-size:10.5px;padding:7px 9px}
  .balance{font-size:10.5px;padding:6px 8px}
  .herotxt h1{font-size:17px}
  .caseimg{height:92px}.caseimg img{width:66px;height:66px}
}
</style>
</head>
<body>
<div class="bgfx" id="bgfx"></div>

<header>
  <div class="logo" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span class="sk">💀</span>Skelet<b>Drop</b></div>
  <div class="headright">
    <div class="balance glass" id="balance">🔵 0 ₽</div>
    <button class="deposit" onclick="depositModal()">⭐ Пополнить</button>
    <button class="iconbtn" id="sndBtn" onclick="toggleSound()" title="Звук">🔊</button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="herotxt">
      <div class="badge glass"><span class="dot"></span>Сезон 2 · Онлайн</div>
      <h1 id="heroTitle">Кейсы с подарками</h1>
      <p id="heroSub">NFT-подарки Telegram и звёзды внутри</p>
      <button class="openhero" onclick="scrollToId('casesTitle')">Открыть кейсы ›</button>
      <div class="dots" id="heroDots"><i class="on"></i><i></i><i></i></div>
    </div>
    <div class="heroart" id="heroart"></div>
  </section>

  <div class="livebar reveal">
    <div class="livepill glass">LIVE</div>
    <div class="liveitems" id="liveitems"></div>
  </div>

  <h2 class="reveal" id="casesTitle">Кейсы <span class="chip glass" id="casecount"></span></h2>
  <div class="casegrid" id="casegrid"></div>

  <h2 class="reveal">Коллекция <span class="chip glass" id="giftcount">0</span></h2>
  <div class="giftgrid" id="collection"></div>

  <h2 class="reveal" id="newsTitle">Новости <span class="chip glass">только текст</span></h2>
  <div class="newslist glass reveal" id="newslist" style="padding:4px 12px;border-radius:16px"></div>
</main>

<div class="bottom" id="bottomnav">
  <button class="active" data-target="top"><span class="bi">⌂</span>Главная</button>
  <button data-target="casesTitle"><span class="bi">◇</span>Кейсы</button>
  <button data-target="collection"><span class="bi">▤</span>Коллекция</button>
  <button data-target="newsTitle"><span class="bi">✦</span>Новости</button>
</div>

<div class="modal" id="modal"><div class="modalbox glass" id="modalcontent"></div></div>

<script>
/* ================= КОНФИГ ================= */
const BOT_USERNAME="SkeletDropPayBot";
const CHECK_SERVER="https://skeletdrop-bot666.onrender.com";
const TG_CHANNEL="https://t.me/SkelwtDrop";
const CDN="https://denzyve.github.io/cdn-telegram-gifts/assets/webp/";
const SAVE_VERSION=16,START_BALANCE=0,STAR_RATE=2,DAY=86400000;

/* ================= СОСТОЯНИЕ ================= */
function freshState(){return{v:SAVE_VERSION,balance:START_BALANCE,collection:[],lastFree:0,subscribed:false,name:"Игрок",avatar:"💀",sound:true};}
let state=null;try{state=JSON.parse(localStorage.getItem("skeletdropSave"));}catch(e){state=null;}
if(!state||state.v!==SAVE_VERSION)state=freshState();
if(typeof state.sound!=="boolean")state.sound=true;
state.balance=Math.round(Number(state.balance));if(isNaN(state.balance)||state.balance<0)state.balance=0;
if(TGW&&TGW.initDataUnsafe&&TGW.initDataUnsafe.user)state.name=TGW.initDataUnsafe.user.first_name||"Игрок";

/* ================= ЗВУК ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(f,d,t,g,s){if(!state.sound)return;const c=ac();if(!c)return;const o=c.createOscillator(),v=c.createGain();o.type=t||"sine";o.frequency.setValueAtTime(f,c.currentTime);if(s)o.frequency.exponentialRampToValueAtTime(s,c.currentTime+d);v.gain.setValueAtTime(g||.12,c.currentTime);v.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(v);v.connect(c.destination);o.start();o.stop(c.currentTime+d);}
const SFX={
 click:()=>tone(520,.06,"triangle",.07),
 coin:()=>{tone(1200,.07,"square",.05);setTimeout(()=>tone(1600,.09,"square",.05),70);},
 win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.15,"triangle",.13),i*90))
};
function toggleSound(){state.sound=!state.sound;save();updateSoundBtn();if(state.sound)SFX.click();}
function updateSoundBtn(){const b=document.getElementById("sndBtn");if(b)b.textContent=state.sound?"🔊":"";}

/* ================= УТИЛИТЫ ================= */
const money=v=>Math.round(Number(v)||0).toLocaleString("ru-RU")+" ₽";
const giftById=id=>gifts.find(g=>g.id===id);
const entryValue=e=>e.nft?giftById(e.nft).price:(e.cash?e.cash:e.stars*STAR_RATE);
const caseMax=c=>Math.max(...c.table.map(t=>entryValue(t[1])));
function toast(m){document.querySelector(".sd-toast")?.remove();const el=document.createElement("div");el.className="sd-toast";el.textContent=m;
 el.style.cssText="position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:rgba(38,20,66,.94);backdrop-filter:blur(14px);color:#fff;padding:11px 17px;border-radius:13px;z-index:200;font-weight:800;font-size:12px;box-shadow:0 8px 24px #0009;border:1px solid rgba(168,85,247,.3);text-align:center;max-width:90%;animation:modalIn .3s";
 document.body.appendChild(el);setTimeout(()=>{el.style.transition="opacity .35s";el.style.opacity=0;setTimeout(()=>el.remove(),350);},2400);}
function confetti(n){const cs=["#ffd45d","#a855f7","#39dca0","#2689ff","#ff7ab0","#fff"];const b=document.createElement("div");b.className="confetti";
 for(let i=0;i<n;i++){const p=document.createElement("i");p.style.background=cs[i%cs.length];p.style.left=(30+Math.random()*40)+"%";p.style.top=(25+Math.random()*20)+"%";
  p.style.setProperty("--dx",(Math.random()*380-190)+"px");p.style.setProperty("--dy",(130+Math.random()*300)+"px");p.style.setProperty("--rz",(Math.random()*860-430)+"deg");p.style.animationDelay=(Math.random()*.25)+"s";b.appendChild(p);}
 document.body.appendChild(b);setTimeout(()=>b.remove(),2300);}
function pay(a){a=Math.max(0,Math.round(Number(a)||0));let b=Math.round(Number(state.balance));if(isNaN(b))b=0;
 if(b<a){toast("Не хватает "+money(a-b)+". Пополни в чате бота ⭐");return false;}state.balance=b-a;save();return true;}
function addMoney(s){state.balance=Math.round(Number(state.balance)||0)+Math.round(s);save();}

/* ================= СЕРВЕР ================= */
async function api(p,b){const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);
 try{const r=await fetch(CHECK_SERVER+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({initData:TG_INIT},b||{})),signal:c.signal});return await r.json();}finally{clearTimeout(t);}}
async function tgLoad(){if(!TG_INIT)return;try{const j=await api("/api/load");if(j.ok&&j.user){
 state.balance=Math.round(Number(j.user.balance))||0;state.collection=Array.isArray(j.user.collection)?j.user.collection:[];
 state.lastFree=Number(j.user.lastFree)||0;state.subscribed=!!j.user.subscribed;
 localStorage.setItem("skeletdropSave",JSON.stringify(state));render();}}catch(e){}}
function tgSave(){if(!TG_INIT)return;api("/api/save",{state:{balance:state.balance,collection:state.collection,lastFree:state.lastFree,subscribed:state.subscribed,name:state.name,avatar:state.avatar}}).catch(()=>{});}
function save(){localStorage.setItem("skeletdropSave",JSON.stringify(state));render();tgSave();}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&TG_INIT)tgLoad();});

<button class="btn" style="width:100%" onclick="closeModal()">Понятно</button>`);}

/* ================= РЕНДЕР ================= */
function fmtRemain(ms){const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;}
function freeRemain(){return Math.max(0,state.lastFree+DAY-Date.now());}
function renderCases(){document.getElementById("casecount").textContent=cases.length+" наборов";
 document.getElementById("casegrid").innerHTML=cases.map((c,i)=>{const r=c.free?freeRemain():0;const btn=c.free?(r>0?"⏳ "+fmtRemain(r):"Открыть бесплатно"):"Открыть кейс";const g=giftById(c.nft);const mx=caseMax(c);
 return `<div class="casecard glass reveal ${c.rc}"><div class="caseimg"><div class="aura"></div><span class="xbadge">макс ${money(mx)}</span><img src="${g.image}" ${fallFor(g.id)}></div>
 <div class="casefoot"><div><h3>${c.name}</h3><div class="muted">${g.name} + ⭐</div></div><div class="price ${c.free?"free":""}">${c.free?"FREE":money(c.price)}</div></div>
 <button class="btn ${c.free?"mint":""}" id="casebtn${i}" style="width:100%;margin-top:6px" onclick="openCase(${i})" ${r>0?"disabled":""}>${btn}</button></div>`;}).join("");}
function renderCollection(){const box=document.getElementById("collection");document.getElementById("giftcount").textContent=state.collection.length+" шт.";
 if(!state.collection.length){box.innerHTML=`<div class="collectionempty glass">Коллекция пока пустая.<br>Открой свой первый кейс! 🎁</div>`;return;}
 box.innerHTML=state.collection.map((id,i)=>{const g=giftById(id);if(!g)return"";
 return `<div class="giftcard glass reveal on ${rarityClass[g.rarity]}"><img src="${g.image}" ${fallFor(g.id)}><h3>${g.name}</h3><div class="rartag">${g.rarity}</div><div class="starbadge">⭐ ${g.stars}</div>
 <div class="giftbtns"><button class="btn secondary" onclick="sellGift(${i})">Продать ${money(g.sell)}</button><button class="btn" onclick="withdrawGift('${g.id}')">📤 Вывести</button></div></div>`;}).join("");}
function renderNews(){document.getElementById("newslist").innerHTML=news.map(n=>`<div class="newsitem"><span class="nd">${n.d}</span>${n.t}</div>`).join("");}
function render(){document.getElementById("balance").textContent="🔵 "+money(state.balance);updateSoundBtn();renderCases();renderCollection();renderNews();observeReveals();}
let observer;
function observeReveals(){observer?.disconnect();if(!("IntersectionObserver" in window)){document.querySelectorAll(".reveal").forEach(e=>e.classList.add("on"));return;}
 observer=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");observer.unobserve(e.target);}});},{threshold:.08});
 document.querySelectorAll(".reveal:not(.on)").forEach(el=>observer.observe(el));
 setTimeout(()=>document.querySelectorAll(".reveal:not(.on)").forEach(el=>{const r=el.getBoundingClientRect();if(r.top<window.innerHeight)el.classList.add("on");}),120);}
function showModal(h){document.getElementById("modalcontent").innerHTML=`<button class="mclose" onclick="closeModal()">×</button>`+h;document.getElementById("modal").classList.add("show");}
let caseTimers=[];
function clearCaseTimers(){caseTimers.forEach(clearTimeout);caseTimers=[];}
function closeModal(){clearCaseTimers();document.getElementById("modal").classList.remove("show");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});

function subscribeModal(){showModal(`<h2>🔔 Бесплатный кейс</h2><div class="tgcard"><span class="tgicon">✈️</span><h3>Подпишись на канал</h3><p class="muted">Подпишись, чтобы открыть бесплатный кейс. Повторно — каждые 24 часа.</p></div>

function tgClicked(){setTimeout(()=>{const b=document.getElementById("tgdone");if(b)b.disabled=false;},1500);}
function claimFree(){state.subscribed=true;save();spinCase(cases[0]);}
function rollEntry(t){const tot=t.reduce((s,x)=>s+x[0],0);let r=Math.random()*tot;for(const[w,e]of t){r-=w;if(r<=0)return e;}return t[t.length-1][1];}
const tileFor=e=>{
 if(e.nft){const g=giftById(e.nft);return{img:g.image,label:g.name,fb:fallFor(e.nft)};}
 if(e.cash)return{img:cashIcon,label:"ДЖЕКПОТ",fb:""};
 return{img:starIcon(e.stars),label:"+"+e.stars+" ⭐",fb:""};
};
function spinCase(item){
 const win=rollEntry(item.table),wt=tileFor(win);
 const isNft=!!win.nft,isCash=!!win.cash;
 const winRub=isNft?giftById(win.nft).price:(isCash?win.cash:win.stars*STAR_RATE);
 const jackpot=isNft||isCash||win.stars>=500;
 const reel=[];
 for(let i=0;i<22;i++){const t=tileFor(rollEntry(item.table));reel.push(`<div class="reelitem"><img src="${t.img}" ${t.fb}><span>${t.label}</span></div>`);}
 reel.push(`<div class="reelitem" id="winTile"><img src="${wt.img}" ${wt.fb}><span>${wt.label}</span></div>`);
 for(let i=0;i<7;i++){const t=tileFor(rollEntry(item.table));reel.push(`<div class="reelitem"><img src="${t.img}" ${t.fb}><span>${t.label}</span></div>`);}
 let res;
 if(isNft){const g=giftById(win.nft);
  res=`<div class="prizewrap"><div class="rays"></div><img src="${g.image}" ${fallFor(g.id)}></div><h2 style="margin:6px 0 3px">${g.name}</h2><div class="resultx jackpot">🔥 ДЖЕКПОТ КЕЙСА!</div><div class="rartag" style="margin:0 auto 6px">${g.rarity} · ⭐ ${g.stars}</div><p class="muted">Подарок добавлен в коллекцию! 🎉</p>`;
 }else if(isCash){
  res=`<div class="prizewrap"><div class="rays"></div><img src="${cashIcon}"></div><h2 style="margin:6px 0 3px">ДЖЕКПОТ</h2><div class="resultx jackpot">💰 +${money(win.cash)}</div><p class="muted">Максимальный приз кейса зачислен на баланс!</p>`;
 }else{
  res=`<div class="prizewrap"><div class="rays"></div><img src="${starIcon(win.stars)}"></div><h2 style="margin:6px 0 3px">+${win.stars} ⭐</h2><div class="resultx ${jackpot?"jackpot":""}">${jackpot?"🔥 МЕГА-УЛОВ!":"Звёзды твои!"}</div><p class="muted">+${money(winRub)} на баланс</p>`;
 }
 showModal(`<h2>${item.name}</h2><div class="xinfo"><div><small>Цена</small><b>${item.free?"FREE":money(item.price)}</b></div><div><small>Макс. приз</small><b>${money(caseMax(item))}</b></div></div>
 <div class="reel spin" id="reelBox"><div class="reelmark"></div><div class="reeltrack spinning" id="reeltrack">${reel.join("")}</div></div>
 <div id="caseResult" class="result">${res}<button class="btn" style="width:100%" onclick="closeModal()">Забрать</button></div>`);
 if(item.free)state.lastFree=Date.now();
 if(isNft)state.collection.push(win.nft);else addMoney(winRub);
 save();
 caseTimers.push(setTimeout(()=>{const t=document.getElementById("reeltrack");if(!t)return;const w=t.parentElement.clientWidth;
  t.style.transform=`translateX(-${8+22*94+42-w/2+(Math.random()*36-18)}px)`;},120));
 caseTimers.push(setTimeout(()=>{
  document.getElementById("reeltrack")?.classList.remove("spinning");
  document.getElementById("reelBox")?.classList.remove("spin");
  document.getElementById("winTile")?.classList.add("win");
  if(jackpot){confetti(isCash?90:56);SFX.win();const mb=document.querySelector(".modalbox");if(mb){mb.classList.add("shake");setTimeout(()=>mb.classList.remove("shake"),600);}}
  else{confetti(24);SFX.coin();}
 },3600));
 caseTimers.push(setTimeout(()=>document.getElementById("caseResult")?.classList.add("show"),3900));
}
function sellGift(i){const g=giftById(state.collection[i]);if(!g)return;state.collection.splice(i,1);addMoney(g.sell);SFX.coin();toast(g.name+" продан за "+money(g.sell));}

/* ================= LIVE: NFT → картинка NFT, звёзды → картинка звезды ================= */
const playerNames=["neo_fox","dweee","Mira","tony","pixel_77","Luna","Max","Alex","kiryaa","Zoya","sk1e","dropp3r"];
const LIVE_STARS=[1,5,10,15,25,50,100,250,500];
function liveItemHTML(){
 const n=playerNames[Math.floor(Math.random()*playerNames.length)];
 if(Math.random()<0.5){
  const g=gifts[Math.floor(Math.random()*gifts.length)];
  return `<div class="liveitem"><img src="${g.image}" ${fallFor(g.id)}><div><small>${n} · ${g.name}</small><b class="giftprice">${money(g.price)}</b></div></div>`;
 }
 const s=LIVE_STARS[Math.floor(Math.random()*LIVE_STARS.length)];
 return `<div class="liveitem"><img src="${starLive}"><div><small>${n} · +${s} ⭐</small><b>${money(s*STAR_RATE)}</b></div></div>`;
}
function renderLive(){const b=document.getElementById("liveitems");b.insertAdjacentHTML("afterbegin",liveItemHTML());while(b.children.length>10)b.lastElementChild.remove();}

const heroSlides=[
 {title:"Кейсы с подарками",sub:"NFT-подарки Telegram и звёзды внутри",img:4},
 {title:"Звёзды из кейсов",sub:"Лови ⭐ и конвертируй в ₽ мгновенно",img:3},
 {title:"Джекпот до 99 999 ₽",sub:"Максимальный приз — в кейсе «Кольцо» 💰",img:4}
];
let heroIndex=0;
function heroNext(){heroIndex=(heroIndex+1)%heroSlides.length;const s=heroSlides[heroIndex];
 const t=document.getElementById("heroTitle"),p=document.getElementById("heroSub"),a=document.getElementById("heroart");
 t.style.cssText=p.style.cssText=a.style.cssText="opacity:0;transform:translateY(8px);transition:.28s";
 setTimeout(()=>{t.textContent=s.title;p.textContent=s.sub;a.style.backgroundImage=`url("${gifts[s.img].image}")`;
  t.style.cssText=p.style.cssText=a.style.cssText="opacity:1;transform:none;transition:.45s ease";},300);
 document.querySelectorAll("#heroDots i").forEach((d,i)=>d.classList.toggle("on",i===heroIndex));}
function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth"});}
document.querySelectorAll("#bottomnav button").forEach(btn=>{btn.addEventListener("click",()=>{
 document.querySelectorAll("#bottomnav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
 btn.dataset.target==="top"?window.scrollTo({top:0,behavior:"smooth"}):scrollToId(btn.dataset.target);});});
window.addEventListener("scroll",()=>{const y=window.scrollY+window.innerHeight*.4;let a="top";
 ["casesTitle","collection","newsTitle"].forEach(id=>{const el=document.getElementById(id);if(el&&el.offsetTop<=y)a=id;});
 document.querySelectorAll("#bottomnav button").forEach(b=>b.classList.toggle("active",b.dataset.target===a));},{passive:true});
setInterval(()=>{const b=document.getElementById("casebtn0");if(!b)return;const r=freeRemain();
 if(r>0){b.disabled=true;b.textContent="⏳ "+fmtRemain(r);}else{b.disabled=false;b.textContent="Открыть бесплатно";}},1000);
(function(){const b=document.getElementById("bgfx");for(let i=0;i<12;i++){const d=document.createElement("i");const s=2+Math.random()*5;
 d.style.width=d.style.height=s+"px";d.style.left=Math.random()*100+"%";d.style.animationDuration=(10+Math.random()*14)+"s";
 d.style.animationDelay=(-Math.random()*20)+"s";d.style.opacity=(.08+Math.random()*.2);b.appendChild(d);}})();

document.getElementById("heroart").style.backgroundImage=`url("${gifts[4].image}")`;
render();
for(let i=0;i<6;i++)renderLive();
setInterval(renderLive,3600);
setInterval(heroNext,5200);
observeReveals();
if(TG_INIT)tgLoad();
