<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171a1f">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>GRAM · Cases & Games</title>
<style>
:root{--void:#171a1f;--coal:#1c2027;--graphite:#22272f;--slate:#2a3038;--raise:#333a44;--blue:#3d9bff;--blue2:#1f6fd0;--blue3:#a6d4ff;--steel:#93a3b8;--violet:#a97bff;--amber:#ffc94d;--crimson:#ff5a72;--mint:#3ddc9a;--orange:#ff8a1f;--ink:#eef4fb;--dim:#8b98a9;--dim2:#6d7a8b;--scrim:rgba(12,15,19,.9);--pane:linear-gradient(155deg,rgba(147,163,184,.11),rgba(61,155,255,.04) 46%,rgba(23,26,31,.55));--edge:rgba(61,155,255,.26);--edge2:rgba(147,163,184,.17);--e:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.4,.64,1);--out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--void);color:var(--ink);overflow-x:hidden;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.bg1{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 18% 8%,rgba(61,155,255,.16),transparent 62%),radial-gradient(50% 36% at 86% 20%,rgba(169,123,255,.12),transparent 62%),radial-gradient(70% 46% at 52% 100%,rgba(147,163,184,.09),transparent 66%)}
.bg3{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(147,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(147,163,184,.045) 1px,transparent 1px);background-size:48px 48px}
::-webkit-scrollbar{width:8px;height:6px}::-webkit-scrollbar-track{background:#1a1e24;border-radius:8px}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue3),var(--blue2));border-radius:8px;border:2px solid #1a1e24}
*{scrollbar-width:thin;scrollbar-color:var(--blue2) #1a1e24}
button,input,select{font-family:inherit}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.glass{background:var(--pane);border:1px solid var(--edge2);border-radius:18px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(238,244,251,.1),0 8px 22px rgba(0,0,0,.38)}
.glass::before{content:"";position:absolute;inset:0 0 66% 0;background:linear-gradient(180deg,rgba(238,244,251,.07),transparent);pointer-events:none;border-radius:inherit}
header{position:sticky;top:0;z-index:40;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(23,26,31,.94);border-bottom:1px solid var(--edge2)}
.me{display:flex;align-items:center;gap:9px;min-width:0}
.avawrap{position:relative;width:40px;height:40px;flex-shrink:0}
.avawrap::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,var(--blue),var(--blue3),var(--violet),var(--blue));animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ava{position:relative;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--void);background:var(--raise);display:grid;place-items:center;font-weight:900;font-size:16px;color:var(--blue3);overflow:hidden}
.balbox{display:flex;flex-direction:column;gap:1px}
.balbox .cap{font-size:8px;font-weight:900;letter-spacing:1.2px;color:var(--dim2);text-transform:uppercase}
.bal{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.1}
.bal .dia{font-size:13px}
.bal.bump{animation:bump .6s}@keyframes bump{40%{transform:scale(1.1);color:var(--mint)}}
.topup{border:1px solid rgba(166,212,255,.5);border-radius:14px;padding:11px 16px;font-size:12.5px;font-weight:900;color:#04121f;cursor:pointer;background:linear-gradient(112deg,var(--blue3),var(--blue) 52%,var(--blue2));box-shadow:0 4px 14px rgba(61,155,255,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.topup:active{transform:scale(.95)}
main{max-width:1060px;margin:auto;padding:10px 11px 96px;position:relative;z-index:1}
.rise{opacity:0;transform:translateY(14px);transition:opacity .5s var(--out),transform .5s var(--out)}.rise.in{opacity:1;transform:none}
.live{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:7px 8px;border-radius:16px;background:linear-gradient(100deg,rgba(61,155,255,.1),rgba(34,39,47,.72));border:1px solid var(--edge2)}
.livetag{display:flex;align-items:center;gap:5px;font-size:8.5px;font-weight:900;letter-spacing:1.4px;color:var(--blue3);flex-shrink:0;padding-left:3px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:beat 1.6s infinite}@keyframes beat{50%{opacity:.25}}
.liverow{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;flex:1;gap:6px}.liverow::-webkit-scrollbar{display:none}
.ltick{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:12px;background:rgba(26,30,36,.78);border:1px solid var(--edge2);animation:tin .4s var(--out)}
@keyframes tin{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.ltick img{width:28px;height:28px;object-fit:contain}
.ltick .who{display:block;color:var(--dim);font-size:8.5px;white-space:nowrap;max-width:88px;overflow:hidden;text-overflow:ellipsis}
.ltick .val{display:block;font-size:11px;font-weight:900;color:var(--blue3);font-variant-numeric:tabular-nums}
h2{font-size:17px;margin:20px 0 11px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--blue3),var(--blue2))}
h2 em{font-style:normal;font-size:9px;font-weight:900;padding:4px 9px;border-radius:11px;color:var(--dim);border:1px solid var(--edge2);background:rgba(26,30,36,.6)}

/* ═════ КАРТОЧКИ ИГР — улучшенный дизайн ═════ */
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.gcard{grid-column:span 2;height:134px;border-radius:22px;position:relative;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 28px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.26);contain:paint;transition:transform .2s var(--e),box-shadow .2s var(--e)}
.gcard:active{transform:scale(.985);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.gcard .gloss{position:absolute;inset:0 0 56% 0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);pointer-events:none;z-index:5}
.gcard .scrim{position:absolute;inset:38% 0 0 0;background:linear-gradient(180deg,transparent,rgba(3,7,14,.6));pointer-events:none;z-index:5}
.gcard .frame{position:absolute;inset:7px;border-radius:16px;border:1px solid rgba(255,255,255,.1);pointer-events:none;z-index:5}
.gcard .tick{position:absolute;width:16px;height:16px;pointer-events:none;z-index:6;border:2px solid rgba(255,255,255,.3)}
.gcard .tick.tl{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.gcard .tick.br{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.gcard .gtitle{position:absolute;left:17px;bottom:15px;z-index:8}
.gcard .gtitle b{display:flex;align-items:center;gap:7px;font-size:25px;font-weight:900;letter-spacing:3px;line-height:1}
.gcard .gtitle b i{font-style:normal;font-size:17px;opacity:.75;transform:translateY(-1px)}
.gcard .gtitle small{display:block;font-size:9px;font-weight:800;letter-spacing:1.4px;margin-top:5px;text-transform:uppercase}
.badgecorner{position:absolute;top:12px;z-index:9;font-size:9px;font-weight:900;letter-spacing:1.5px;padding:5px 11px;border-radius:10px}
.hitbadge{right:12px;color:#2a0d00;background:linear-gradient(105deg,#ffe9a8,var(--orange));box-shadow:0 3px 12px rgba(255,138,31,.5),inset 0 1px 0 rgba(255,255,255,.6);animation:hitp 1.8s infinite}
@keyframes hitp{50%{transform:scale(1.07)}}
.newbadge{left:12px;color:#04240f;background:linear-gradient(105deg,#a8f7d8,#22c084);box-shadow:0 3px 12px rgba(61,220,154,.5),inset 0 1px 0 rgba(255,255,255,.6);animation:hitp 1.8s infinite}

/* CRASH — синий */
.gcard.crash{background:linear-gradient(128deg,#0a2650,#13417e 44%,#2470c4)}
.gcard.crash .bg{position:absolute;inset:0;background:radial-gradient(56% 64% at 74% 40%,rgba(110,190,255,.42),transparent 70%),radial-gradient(48% 58% at 10% 92%,rgba(6,32,74,.7),transparent 72%)}
.gcard.crash .gtitle b{color:#fff;text-shadow:0 3px 16px rgba(0,18,48,.95)}
.gcard.crash .gtitle small{color:#bfe0ff}
.cstars{position:absolute;inset:0;z-index:1}
.cstars i{position:absolute;border-radius:50%;background:#dceaff;display:block;animation:cd linear infinite;will-change:transform}
@keyframes cd{from{transform:translate3d(0,0,0)}to{transform:translate3d(-64px,28px,0)}}
.ccurve{position:absolute;inset:0;z-index:2;width:100%;height:100%;opacity:.3}
.crashrocket{position:absolute;right:18px;top:46%;width:62px;margin-top:-50px;z-index:7;animation:bob 3.6s ease-in-out infinite;transform-origin:50% 62%;will-change:transform}
@keyframes bob{0%,100%{transform:translateY(-4px) rotate(25deg)}50%{transform:translateY(4px) rotate(34deg)}}
.mchip{position:absolute;z-index:8;font-size:11px;font-weight:900;color:#04240f;padding:3px 9px;border-radius:9px;background:linear-gradient(105deg,#a8f7d8,#22c084);box-shadow:0 3px 10px rgba(61,220,154,.45),inset 0 1px 0 rgba(255,255,255,.55);opacity:0;animation:mfloat 2.4s ease-out infinite;will-change:transform,opacity;pointer-events:none;font-variant-numeric:tabular-nums}
@keyframes mfloat{0%{opacity:0;transform:translateY(8px) scale(.6)}18%{opacity:1;transform:translateY(0) scale(1)}68%{opacity:1;transform:translateY(-9px) scale(1)}100%{opacity:0;transform:translateY(-22px) scale(.85)}}

/* UPGRADER — жёлтый */
.gcard.upg{background:linear-gradient(128deg,#8f6a0e,#cf9f20 40%,#ffd76a)}
.gcard.upg .bg{position:absolute;inset:0;background:radial-gradient(54% 62% at 76% 44%,rgba(255,246,205,.6),transparent 70%),radial-gradient(58% 60% at 6% 98%,rgba(84,56,0,.6),transparent 72%)}
.gcard.upg .scrim{background:linear-gradient(180deg,transparent,rgba(96,66,0,.34))}
.gcard.upg .frame{border-color:rgba(255,255,255,.22)}
.gcard.upg .tick{border-color:rgba(90,62,0,.4)}
.gcard.upg .gtitle b{color:#2b1d00;text-shadow:0 2px 10px rgba(255,244,200,.75)}
.gcard.upg .gtitle small{color:#6d4f00}
.udemo{position:absolute;right:16px;top:46%;width:100px;height:100px;margin-top:-50px;z-index:7}
.udemo svg{width:100%;height:100%;display:block;overflow:visible}
.udemo .needle{transform-origin:100px 100px;animation:demo 6.5s cubic-bezier(.16,.9,.2,1) infinite;will-change:transform}
@keyframes demo{0%{transform:rotate(0)}17%{transform:rotate(412deg)}33%{transform:rotate(412deg)}53%{transform:rotate(806deg)}69%{transform:rotate(806deg)}90%{transform:rotate(1148deg)}100%{transform:rotate(1148deg)}}
.udemo .arcA{animation:arcP 6.5s ease-in-out infinite}
@keyframes arcP{0%,18%{opacity:1}26%,54%{opacity:.55}62%,92%{opacity:1}100%{opacity:1}}
.uspark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fffbe8;box-shadow:0 0 9px #fff;animation:usp 2.6s ease-in-out infinite}
@keyframes usp{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.25)}}

/* PLAY HUB — фиолетовый + 3 геймплея стопкой */
.playhub{grid-column:span 2;margin:0 -5px;border:1px solid rgba(214,180,255,.34);border-radius:22px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(118deg,#2e1558,#5a2fa0 46%,#8f52e0);position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.24);contain:paint;transition:transform .2s var(--e)}
.playhub:active{transform:scale(.985)}
.playhub .bg{position:absolute;inset:0;background:radial-gradient(48% 68% at 82% 50%,rgba(226,198,255,.36),transparent 70%),radial-gradient(52% 60% at 4% 98%,rgba(34,10,70,.62),transparent 72%)}
.playhub .gloss{position:absolute;inset:0 0 58% 0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent);pointer-events:none}
.playhub .frame{position:absolute;inset:7px;border-radius:16px;border:1px solid rgba(255,255,255,.12);pointer-events:none}
.phtxt{position:relative;z-index:4;min-width:0}
.phtxt b{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:900;letter-spacing:3px;color:#fff;text-shadow:0 3px 14px rgba(28,0,58,.85)}
.phtxt b i{font-style:normal;font-size:15px;opacity:.75}
.phtxt small{display:block;font-size:9.5px;font-weight:800;color:#e4d3ff;margin-top:5px;letter-spacing:.6px}
.phtags{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.phtags span{font-size:7.5px;font-weight:900;letter-spacing:.8px;padding:3px 7px;border-radius:8px;background:rgba(22,8,44,.55);border:1px solid rgba(214,180,255,.34);color:#ecdcff}
.phstack{--mw:74px;--mh:62px;--off:46px;position:relative;width:calc(var(--mw) + var(--off)*2);height:calc(var(--mh) + 26px);flex-shrink:0;z-index:4;animation:stackFloat 5.5s ease-in-out infinite;will-change:transform}
@keyframes stackFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.phstack::before{content:"";position:absolute;inset:-16px;background:radial-gradient(circle,rgba(226,198,255,.3),transparent 68%);z-index:0}
.mini{position:absolute;width:var(--mw);height:var(--mh);border-radius:13px;overflow:hidden;border:1px solid rgba(255,255,255,.26);box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.mini .lb{position:absolute;top:4px;left:6px;font-size:6px;font-weight:900;letter-spacing:1px;color:#fff;opacity:.9;z-index:6;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.mini .gl{position:absolute;inset:0 0 60% 0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent);z-index:5;pointer-events:none}
.mini.slots{right:0;top:0;z-index:1;background:linear-gradient(150deg,#43205e,#200f2e);transform:rotate(7deg)}
.mini.plinko{right:var(--off);top:13px;z-index:2;background:linear-gradient(150deg,#123a63,#0a1c33);transform:rotate(2deg)}
.mini.mines{right:calc(var(--off)*2);top:26px;z-index:3;background:linear-gradient(150deg,#13402f,#0a2018);transform:rotate(-5deg)}
/* mines mini */
.mgrid{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:76%}
.mt{position:relative;aspect-ratio:1;border-radius:4px;background:rgba(80,140,110,.28);border:1px solid rgba(160,240,200,.28);display:grid;place-items:center}
.mt i{position:absolute;font-style:normal;font-size:9px;opacity:0;animation:mgem 2.6s ease-out infinite;will-change:transform,opacity}
@keyframes mgem{0%,8%{opacity:0;transform:scale(.3)}20%,70%{opacity:1;transform:scale(1)}86%,100%{opacity:0;transform:scale(.55)}}
/* plinko mini */
.ppin{position:absolute;width:4px;height:4px;margin:-2px;border-radius:50%;background:#9fc6ee}
.pball{position:absolute;left:50%;top:15px;width:6px;height:6px;margin:-3px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#ffd76a);box-shadow:0 0 7px #ffc94d;animation:pfall 1.8s cubic-bezier(.4,.1,.6,1) infinite;will-change:transform}
@keyframes pfall{0%{transform:translate(0,0);opacity:1}22%{transform:translate(-9px,10px)}44%{transform:translate(3px,20px)}66%{transform:translate(-6px,30px)}86%{transform:translate(7px,38px);opacity:1}100%{transform:translate(7px,42px);opacity:0}}
.pbin{position:absolute;bottom:5px;height:7px;border-radius:2px;background:linear-gradient(#5b8fd0,#2c5a94)}
.pbin.hot{background:linear-gradient(#a8f7d8,#22c084);animation:phot 1.8s steps(1) infinite}
@keyframes phot{0%,84%{opacity:.4}86%,100%{opacity:1}}
/* slots mini */
.sreels{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:flex;gap:3px}
.sreel{width:19px;height:20px;border-radius:4px;background:rgba(12,5,24,.85);border:1px solid rgba(214,180,255,.34);overflow:hidden;position:relative}
.sstrip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:20px;animation:sspin 2.6s cubic-bezier(.15,.85,.2,1) infinite;will-change:transform}
.sreel:nth-child(2) .sstrip{animation-delay:.15s}
.sreel:nth-child(3) .sstrip{animation-delay:.3s}
@keyframes sspin{0%{transform:translateY(0)}44%{transform:translateY(-60px)}100%{transform:translateY(-60px)}}
.sline{position:absolute;left:8px;right:8px;top:54%;height:1.5px;background:linear-gradient(90deg,transparent,#ffd76a,transparent);animation:sline 2.6s steps(1) infinite}
@keyframes sline{0%,46%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}

.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.case{border-radius:19px;padding:9px;cursor:pointer;position:relative;overflow:hidden;contain:paint;border:1px solid color-mix(in srgb,var(--tc) 34%,transparent);background:radial-gradient(120% 92% at 50% 6%,color-mix(in srgb,var(--tc) 20%,transparent),rgba(28,32,39,.94) 66%);transition:transform .2s var(--e)}
.case:active{transform:scale(.98)}
.case .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.07) 50%,transparent 62%);pointer-events:none;z-index:6}
.tier{position:absolute;top:8px;left:8px;z-index:7;font-size:7.5px;font-weight:900;letter-spacing:1.1px;padding:4px 8px;border-radius:9px;text-transform:uppercase;color:var(--tc);background:color-mix(in srgb,var(--tc) 18%,rgba(20,24,29,.9));border:1px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.cnft{position:absolute;top:8px;right:8px;z-index:7;font-size:7.5px;font-weight:900;padding:4px 7px;border-radius:9px;color:var(--dim);background:rgba(20,24,29,.8);border:1px solid var(--edge2)}
.cart{height:112px;position:relative}
.cart .glow{position:absolute;left:50%;top:48%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 42%,transparent),transparent 66%);animation:gpulse 3.6s ease-in-out infinite;will-change:transform,opacity}
@keyframes gpulse{50%{transform:scale(1.12);opacity:.7}}
.cart .plat{position:absolute;left:50%;bottom:6px;width:100px;height:14px;margin-left:-50px;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--tc) 50%,transparent),transparent 72%)}
.cart .fan{position:absolute;inset:0;animation:fanFloat 4.2s ease-in-out infinite;will-change:transform}
@keyframes fanFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.cart .fan img{position:absolute;bottom:14px;width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.65))}
.cart .spk{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 7px var(--tc);animation:spk 3s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.9;transform:scale(1.2)}}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 3px 2px;position:relative;z-index:7}
.cfoot h3{font-size:13px;margin:0;font-weight:900}
.cprice{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:900;padding:6px 10px;border-radius:12px;background:rgba(20,24,29,.8);border:1px solid color-mix(in srgb,var(--tc) 36%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap}
.cprice.free{color:var(--mint);border-color:rgba(61,220,154,.45)}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.item{border-radius:16px;padding:8px}
.item img{width:100%;height:64px;object-fit:contain;border-radius:12px;background:radial-gradient(circle,rgba(61,155,255,.14),rgba(26,30,36,.8) 74%)}
.item h3{font-size:10.5px;margin:6px 0 2px;font-weight:800}
.igr{font-size:7.5px;font-weight:900;text-transform:uppercase;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);padding:2px 6px;border-radius:9px;width:max-content;background:color-mix(in srgb,var(--tc) 12%,transparent)}
.iacts{display:flex;flex-direction:column;gap:5px;margin-top:7px}.iacts .act{padding:7px 5px;font-size:9.5px}
.empty{grid-column:1/-1;text-align:center;padding:26px;border-radius:16px;color:var(--dim);font-weight:700;font-size:12px}
.act{border:1px solid rgba(166,212,255,.42);color:#04121f;border-radius:13px;padding:12px 14px;font-weight:900;font-size:12.5px;cursor:pointer;background:linear-gradient(108deg,var(--blue3),var(--blue),var(--blue2));box-shadow:0 4px 12px rgba(61,155,255,.26),inset 0 1px 0 rgba(255,255,255,.45);transition:.16s var(--e);text-decoration:none;display:inline-block;text-align:center}
.act:active{transform:scale(.96)}
.act.ghost{background:rgba(147,163,184,.1);color:var(--ink);border-color:var(--edge2);box-shadow:none}
.act.good{background:linear-gradient(108deg,#7cf0c6,#22c084);color:#041a10;border-color:rgba(124,240,198,.42)}
.act.warn{background:linear-gradient(108deg,#ffd76a,var(--orange));color:#2a0d00;border-color:rgba(255,201,77,.45)}
.act:disabled{opacity:.36;cursor:not-allowed;transform:none}
.veil{position:fixed;inset:0;background:var(--scrim);z-index:60;display:none;align-items:center;justify-content:center;padding:8px}
.veil.on{display:flex;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{width:min(480px,100%);max-height:97dvh;display:flex;flex-direction:column;gap:9px;border-radius:22px;padding:15px;overflow:hidden;animation:sIn .3s var(--spring);background:linear-gradient(155deg,#262c35,#1a1e25);border:1px solid var(--edge2);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.sheet.wide{width:min(660px,100%);padding:13px;gap:8px}
.sheet.hilo{gap:7px;padding:13px}
.sheet>*{flex:0 0 auto;min-height:0}
.sheet.jolt{animation:jolt .45s}
@keyframes jolt{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes sIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.sheet h2{font-size:17px;margin:0;padding-right:40px}.sheet h2::before{display:none}
.shut{position:absolute;top:11px;right:11px;z-index:20;border:1px solid var(--edge2);color:var(--steel);width:31px;height:31px;border-radius:50%;font-size:17px;cursor:pointer;background:rgba(26,30,36,.95);display:grid;place-items:center;padding:0}
.lbl{font-size:9px;font-weight:900;letter-spacing:1.2px;color:var(--dim2);text-transform:uppercase}
.msg{text-align:center;font-size:12px;font-weight:800;color:var(--steel);min-height:17px;line-height:1.3}
.meters{display:flex;gap:8px}
.meters>div{flex:1;text-align:center;padding:9px 5px;border-radius:13px;background:rgba(20,24,29,.62);border:1px solid var(--edge2)}
.meters b{display:block;font-size:14px;color:var(--blue3);margin-top:2px;font-variant-numeric:tabular-nums}
.meters small{color:var(--dim2);font-size:8px;font-weight:800;text-transform:uppercase}
.field{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--edge2);background:rgba(20,24,29,.72);color:var(--ink);font-size:15px;font-weight:800;outline:none}
.field:focus{border-color:var(--blue)}
.row{display:flex;gap:8px}.row .act{flex:1;min-width:0;padding:12px 6px;font-size:12.5px}
.quick{display:flex;gap:6px}
.quick button{flex:1;padding:8px 2px;border-radius:11px;border:1px solid var(--edge2);background:rgba(20,24,29,.62);color:var(--steel);font-weight:900;font-size:10.5px;cursor:pointer}
.tabs{display:flex;gap:7px}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--edge2);background:rgba(20,24,29,.62);color:var(--steel);font-weight:900;font-size:11px;cursor:pointer}
.tabs button.on{background:linear-gradient(108deg,var(--blue3),var(--blue));color:#04121f}
.bar{height:8px;border-radius:5px;background:rgba(20,24,29,.7);overflow:hidden;border:1px solid var(--edge2)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue3));transition:width .3s var(--e)}
.log{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;min-height:22px}.log::-webkit-scrollbar{display:none}
.log span{flex:0 0 auto;font-size:10px;font-weight:900;padding:3px 9px;border-radius:10px;background:rgba(20,24,29,.66);border:1px solid var(--edge2);font-variant-numeric:tabular-nums}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 20%,transparent),rgba(20,24,29,.72));border:1px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.chead .cn{font-size:15px;font-weight:900}
.chead .ct{font-size:8px;font-weight:900;letter-spacing:1.1px;color:var(--tc);text-transform:uppercase;margin-top:2px}
.chead .cp{display:flex;align-items:center;gap:5px;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.strip{height:112px;overflow:hidden;border-radius:15px;background:#1a1e24;position:relative;border:1px solid var(--edge)}
.strip::before,.strip::after{content:"";position:absolute;top:0;bottom:0;width:52px;z-index:2;pointer-events:none}
.strip::before{left:0;background:linear-gradient(90deg,#1a1e24,transparent)}.strip::after{right:0;background:linear-gradient(-90deg,#1a1e24,transparent)}
.needle{position:absolute;left:50%;top:0;bottom:0;width:2px;z-index:3;background:linear-gradient(var(--blue3),transparent);box-shadow:0 0 10px var(--blue)}
.track{display:flex;align-items:center;gap:9px;height:100%;padding:7px;transition:transform 3.6s cubic-bezier(.08,.76,.03,1);will-change:transform}
.track.blur{filter:blur(1.2px)}
.cell{flex:0 0 80px;height:96px;background:linear-gradient(150deg,var(--raise),#1c2027);border:1px solid var(--edge2);border-radius:13px;display:grid;place-items:center;padding:5px}
.cell img{width:52px;height:52px;object-fit:contain}
.cell span{font-size:8.5px;color:var(--dim);text-align:center;font-weight:700}
.cell.hit{border-color:var(--blue3);box-shadow:0 0 16px rgba(61,155,255,.45);animation:cp .7s}
@keyframes cp{45%{transform:scale(1.16)}100%{transform:scale(1.05)}}
.drops{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:start;overflow:hidden}
.drop{position:relative;border-radius:12px;padding:7px 4px;text-align:center;background:rgba(20,24,29,.64);border:1px solid var(--edge2);overflow:hidden}
.drop.best{border-color:color-mix(in srgb,var(--tc) 62%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 18%,transparent),rgba(20,24,29,.64))}
.drop img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto}
.drop .dn{font-size:8.5px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop .dv{font-size:9px;font-weight:900;color:var(--blue3)}
.drop .dc{position:absolute;top:3px;right:4px;font-size:7.5px;font-weight:900;color:var(--mint)}
.verdict{display:none;text-align:center;flex:1 1 auto;min-height:0;flex-direction:column;justify-content:center;gap:8px;padding:12px;border-radius:16px;background:rgba(61,155,255,.07);border:1px solid var(--edge2)}
.verdict.on{display:flex;animation:sIn .35s}.verdict h3{font-size:16px;margin:0}
.halo2{position:relative;width:110px;height:110px;margin:0 auto;display:grid;place-items:center;flex:0 1 auto;min-height:64px}
.halo2 .beams{position:absolute;inset:-18px;border-radius:50%;animation:spin 6s linear infinite;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(61,155,255,.32) 40deg 80deg,transparent 80deg 120deg,rgba(166,212,255,.3) 120deg 160deg,transparent 160deg 200deg,rgba(61,155,255,.32) 200deg 240deg,transparent 240deg 280deg,rgba(166,212,255,.3) 280deg 320deg,transparent)}
.halo2 img{position:relative;width:100%;height:100%;max-width:88px;max-height:88px;object-fit:contain;animation:pop .45s}
.halo2 .bigdia{font-size:64px;animation:pop .45s}
@keyframes pop{from{transform:scale(0) rotate(-18deg)}to{transform:none}}
.badge{display:inline-block;font-weight:900;font-size:12.5px;padding:7px 14px;border-radius:13px;margin:0 auto;background:linear-gradient(108deg,var(--blue3),var(--blue));color:#04121f}
.badge.big{background:linear-gradient(108deg,var(--amber),var(--orange));color:#281000;animation:bp 1.1s infinite}
@keyframes bp{50%{transform:scale(1.05)}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.burst i{position:absolute;width:8px;height:12px;border-radius:2px;animation:fall 1.6s cubic-bezier(.15,.6,.4,1) forwards;will-change:transform,opacity}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rz));opacity:0}}

/* кнопки апгрейдера */
.u2btn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ubtn{position:relative;border:1px solid rgba(61,155,255,.4);border-radius:17px;padding:14px 8px;cursor:pointer;background:linear-gradient(160deg,rgba(61,155,255,.2),rgba(20,24,29,.75));display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.16);transition:.18s var(--e)}
.ubtn::before{content:"";position:absolute;inset:0 0 62% 0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent)}
.ubtn:active{transform:scale(.97)}
.ubtn.prize{border-color:rgba(169,123,255,.45);background:linear-gradient(160deg,rgba(169,123,255,.22),rgba(20,24,29,.75))}
.ubtn .plus{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:900;color:#04121f;background:linear-gradient(130deg,#fff,var(--blue3) 55%,var(--blue));box-shadow:0 4px 12px rgba(61,155,255,.4),inset 0 1px 0 rgba(255,255,255,.8);line-height:1}
.ubtn.prize .plus{background:linear-gradient(130deg,#fff,#d9bcff 55%,var(--violet));box-shadow:0 4px 12px rgba(169,123,255,.4),inset 0 1px 0 rgba(255,255,255,.8)}
.ubtn b{position:relative;font-size:11.5px;font-weight:900;letter-spacing:.3px}
.upcols{display:grid;grid-template-columns:1fr 26px 1fr;gap:8px}
.uslot{border-radius:14px;padding:10px 6px;background:rgba(20,24,29,.64);border:1px solid var(--edge2);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px}
.uslot.s{border-color:rgba(61,155,255,.38)}.uslot.d{border-color:rgba(169,123,255,.38)}
.uslot img{width:40px;height:40px;object-fit:contain}
.uslot .un{font-size:10.5px;font-weight:800}.uslot .uv{font-size:14px;font-weight:900;color:var(--blue3)}
.uslot .dash{font-size:26px;color:var(--dim2)}
.uemoji{font-size:25px;line-height:1}
.uarr{font-size:19px;color:var(--blue);text-align:center;align-self:center;animation:ap 1.6s infinite}@keyframes ap{50%{transform:translateX(4px);opacity:.5}}
.dial{position:relative;width:clamp(140px,25dvh,215px);height:clamp(140px,25dvh,215px);margin:0 auto;flex:0 1 auto}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dcenter{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.dcenter .p{font-size:clamp(24px,4.6dvh,34px);font-weight:900;color:var(--blue3);line-height:1}
.dcenter .c{font-size:8px;font-weight:900;letter-spacing:1.3px;color:var(--dim2);margin-top:3px}
.dcenter .m{font-size:12px;font-weight:900;margin-top:3px}
.dial.win .dcenter .p{color:var(--mint)}.dial.lose .dcenter .p{color:var(--crimson)}
.pveil{position:fixed;inset:0;background:rgba(12,15,19,.88);z-index:80;display:none;align-items:center;justify-content:center;padding:10px}.pveil.on{display:flex}
.ppanel{width:min(430px,100%);max-height:88dvh;display:flex;flex-direction:column;gap:10px;border-radius:22px;padding:15px;overflow:hidden;animation:sIn .28s var(--spring);background:linear-gradient(155deg,#262c35,#1a1e25);border:1px solid var(--edge2)}
.ppanel h2{font-size:16px;margin:0;padding-right:38px}.ppanel h2::before{display:none}
.pgram{display:flex;align-items:center;gap:9px;padding:11px;border-radius:14px;background:linear-gradient(110deg,rgba(61,155,255,.16),rgba(20,24,29,.66));border:1px solid rgba(61,155,255,.36)}
.pgram .pd{font-size:24px}.pgram .field{flex:1;padding:9px 11px;font-size:14px}
.pgrid{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.pitem{border-radius:13px;padding:8px 5px;text-align:center;cursor:pointer;background:rgba(20,24,29,.64);border:1px solid var(--edge2)}
.pitem img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto}
.pitem .pn{font-size:9.5px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pv{font-size:10px;font-weight:900;color:var(--blue3)}
.pempty{grid-column:1/-1;text-align:center;padding:22px;color:var(--dim);font-size:11.5px;font-weight:700}
/* кнопки игр в PLAY HUB */
.phgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phcard{position:relative;height:116px;border-radius:19px;cursor:pointer;overflow:hidden;border:1px solid color-mix(in srgb,var(--gc) 45%,transparent);background:linear-gradient(155deg,var(--g1),var(--g2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .18s var(--e)}
.phcard:active{transform:scale(.96)}
.phcard::before{content:"";position:absolute;inset:0 0 58% 0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent)}
.phcard::after{content:"";position:absolute;inset:6px;border-radius:14px;border:1px solid rgba(255,255,255,.1);pointer-events:none}
.phcard .em{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.phcard b{position:relative;font-size:12px;font-weight:900;letter-spacing:1.7px;text-align:center;padding:0 5px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.phcard small{position:relative;font-size:8px;font-weight:800;letter-spacing:.6px;color:rgba(255,255,255,.72)}
.phcard .arrow{position:absolute;top:9px;right:10px;font-size:12px;font-weight:900;color:rgba(255,255,255,.6)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:8px;flex:1 1 auto;width:min(100%,300px);margin:0 auto;min-height:290px;max-height:min(460px,56dvh)}
.tile{border-radius:13px;border:1px solid var(--edge2);background:linear-gradient(150deg,var(--raise),#1e232b);display:grid;place-items:center;font-size:23px;cursor:pointer;padding:0;min-height:0}
.tile.safe{background:radial-gradient(circle,#22c084,#0a4a33);border-color:var(--mint);animation:pop .28s}
.tile.bomb{background:radial-gradient(circle,#c4203a,#4d0c17);border-color:var(--crimson);animation:jolt .4s}
.tile.fade{opacity:.3}
.cosmos{position:relative;flex:1 1 auto;min-height:190px;max-height:min(390px,49dvh);border-radius:18px;overflow:hidden;border:1px solid var(--edge);background:radial-gradient(110% 90% at 76% 8%,#2b3340,#1e232b 48%,#171b21);contain:paint}
.neb{position:absolute;inset:0;background:radial-gradient(42% 42% at 72% 22%,rgba(255,138,31,.18),transparent 70%),radial-gradient(38% 38% at 22% 74%,rgba(61,155,255,.2),transparent 70%)}
.sf{position:absolute;inset:0}.sf i{position:absolute;border-radius:50%;background:#e7f1ff;display:block}
.cosmos.fly .sf i{animation:srun linear infinite;will-change:transform}
@keyframes srun{to{transform:translate3d(-120px,52px,0)}}
.orb{position:absolute;border-radius:50%;opacity:.8}
.orb.a{width:54px;height:54px;right:-14px;top:16px;background:radial-gradient(circle at 34% 30%,#bcd9f5,#3a6a9e 58%,#1a2c42)}
.orb.b{width:24px;height:24px;left:13px;bottom:18px;background:radial-gradient(circle at 36% 32%,#d6bcff,#7b4fd4 60%,#2f1a55)}
.mesh{position:absolute;inset:-60px;opacity:.12;background-size:36px 36px;background-image:linear-gradient(rgba(147,163,184,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(147,163,184,.4) 1px,transparent 1px);will-change:transform}
.warp{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(115deg,transparent 0 12px,rgba(255,214,140,.13) 12px 13px,transparent 13px 26px)}
.arc{position:absolute;inset:0;width:100%;height:100%}
.ship{position:absolute;left:12%;bottom:12%;width:60px;transform:translate(-50%,50%) rotate(34deg);transform-origin:50% 46%;z-index:4;will-change:transform,left,bottom}
.cosmos:not(.fly) .flame{opacity:.4}
.bigm{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:38px;font-weight:900;z-index:5;color:var(--blue3);text-shadow:0 0 20px rgba(61,155,255,.7);font-variant-numeric:tabular-nums;pointer-events:none}
.fstat{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:8px;font-weight:900;letter-spacing:1.8px;z-index:5;color:var(--dim);pointer-events:none}
.boom{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;opacity:0;z-index:6;background:radial-gradient(circle,#fff,var(--amber) 32%,var(--orange) 55%,var(--crimson) 72%,transparent 78%)}
.boom.go{animation:bl .55s ease-out forwards}
@keyframes bl{0%{transform:scale(.4);opacity:1}60%{transform:scale(8);opacity:.85}100%{transform:scale(13);opacity:0}}
.cosmos.down{animation:jolt .45s}
.ex{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;z-index:3;background:var(--amber);animation:exo .65s ease-out forwards;will-change:transform,opacity}
@keyframes exo{to{transform:translate(var(--ex),var(--ey)) scale(.15);opacity:0}}
.shard{position:absolute;width:6px;height:6px;margin:-3px;border-radius:2px;z-index:6;animation:sho .8s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes sho{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
.board{position:relative;flex:1 1 auto;min-height:225px;max-height:min(450px,55dvh);border-radius:18px;overflow:hidden;border:1px solid var(--edge);background:linear-gradient(#252b34,#191d23);contain:paint}
.board::after{content:"";position:absolute;left:10px;right:10px;bottom:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(61,155,255,.42),transparent)}
.pin{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#7b8a9e;z-index:2;transition:transform .12s,background .12s}

.marble{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;z-index:4;box-shadow:0 0 14px var(--blue);background:radial-gradient(circle at 35% 30%,#fff,var(--blue3) 55%,var(--blue2));will-change:left,top}
.bin{position:absolute;bottom:10px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:9.5px;font-weight:900;color:#04121f;background:linear-gradient(var(--blue3),var(--blue));z-index:3;transition:transform .16s}
.bin.low{background:linear-gradient(var(--raise),#252b34);color:var(--steel);border:1px solid var(--edge2)}
.bin.lit{transform:scale(1.14);box-shadow:0 0 14px var(--blue)}
.reels{display:flex;gap:10px;justify-content:center;position:relative}
.reel{width:86px;height:98px;border-radius:15px;background:#1c2027;border:1px solid var(--edge);display:grid;place-items:center;font-size:42px;overflow:hidden}
.reel.spin{filter:blur(1.2px)}.reel.stop{animation:pop .3s}
.reel.wl{border-color:var(--blue3);box-shadow:0 0 16px rgba(61,155,255,.45)}
.payline{position:absolute;left:5px;right:5px;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--blue3),transparent)}
.pt{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.pt div{background:rgba(20,24,29,.64);border:1px solid var(--edge2);border-radius:11px;padding:6px 1px;text-align:center;font-size:8.5px;font-weight:900;color:var(--steel)}
.pt div b{display:block;font-size:17px}
.hlst{position:relative;flex:1 1 auto;min-height:132px;max-height:min(280px,32dvh);border-radius:22px;overflow:hidden;border:1px solid rgba(61,155,255,.3);background:radial-gradient(100% 84% at 50% 4%,#39424f,#1b2027 72%);display:grid;place-items:center;contain:paint}
.hlst .aura{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 60%,rgba(61,155,255,.32) 84%,transparent);animation:spin 14s linear infinite;will-change:transform}
